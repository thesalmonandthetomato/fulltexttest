name: Research Rabbit OA 15-record test

on:
  workflow_dispatch:

concurrency:
  group: research-rabbit-oa-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade requests pandas pypdf

      - name: Run OA retrieval experiment
        env:
          UNPAYWALL_EMAIL: ${{ github.actor }}@users.noreply.github.com
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, os, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          SRC=Path('data/living_evidence_map_master.csv')
          OUT=Path('research_rabbit_oa_test'); OUT.mkdir(exist_ok=True)
          PDFDIR=OUT/'downloads'; PDFDIR.mkdir(exist_ok=True)
          session=requests.Session(); session.headers.update({'User-Agent':'fulltexttest Research-Rabbit-OA experiment/1.0'})

          rows=list(csv.reader(SRC.open(encoding='utf-8-sig',newline='')))
          header, body=rows[0], rows[1:]
          if len(header)<7: raise SystemExit('Master database has fewer than 7 columns; Column G cannot be used.')
          doi_idx=next((i for i,h in enumerate(header) if 'doi' in h.lower()),None)
          if doi_idx is None: raise SystemExit('No DOI column found')

          def norm_doi(s):
              s=(s or '').strip(); s=re.sub(r'^https?://doi.org/','',s,flags=re.I); s=re.sub(r'^doi:\s*','',s,flags=re.I); return s.rstrip(' .;,').lower()
          def norm_title(s):
              return re.sub(r'[^a-z0-9]+',' ',(s or '').lower()).strip()
          def title_score(a,b):
              A=set(norm_title(a).split()); B=set(norm_title(b).split())
              if not A or not B: return 0.0
              return len(A&B)/len(A|B)
          def pdf_text(path):
              try:
                  reader=PdfReader(str(path)); text='\n'.join((p.extract_text() or '') for p in reader.pages[:5])
                  return text[:30000]
              except Exception as e: return ''
          def observed_dois(text):
              return {norm_doi(x) for x in re.findall(r'10\.\d{4,9}/[-._;()/:A-Z0-9]+',text,re.I)}
          def download(url,path):
              try:
                  r=session.get(url,timeout=25,allow_redirects=True); r.raise_for_status()
                  ctype=r.headers.get('content-type','').lower()
                  if 'pdf' not in ctype and not r.content.startswith(b'%PDF'): return False, f'not_pdf:{r.status_code}:{ctype}'
                  path.write_bytes(r.content); return True, f'ok:{r.status_code}:{ctype}'
              except Exception as e: return False, f'{type(e).__name__}:{e}'

          # Use the same 15-record corpus: 14 known DOI records plus the first explicit no-DOI record
          # from the existing test corpus. We do not substitute arbitrary records merely to fill the count.
          wanted={
            '10.1201/9781003077770-78','10.18174/371265','10.56093/ehyqc013','10.1111/jfb.12710',
            '10.1007/s10750-026-06204-0','10.1002/fsh.10985','10.2458/v24i1.20963',
            '10.6084/m9.figshare.31147177.v1','10.14288/1.0058967','10.1021/pr049840t',
            '10.1038/s41598-019-39080-x','10.3354/dao01972','10.1007/s11160-022-09714-x',
            '10.15586/ijfs.v38i2.3600'
          }
          selected=[r for r in body if len(r)>=7 and norm_doi(r[doi_idx]) in wanted]
          if len(selected)!=14: raise SystemExit(f'Expected 14 DOI records, found {len(selected)}')
          nodoi=next((r for r in body if len(r)>=7 and not norm_doi(r[doi_idx]) and r[6].strip()),None)
          if nodoi is None: raise SystemExit('Could not identify no-DOI test record')
          selected.append(nodoi)

          audit=[]
          for n,r in enumerate(selected,1):
              title=r[6].strip(); doi=norm_doi(r[doi_idx]); rec=f'{n:02d}'
              entry={'record':rec,'title_column_G':title,'doi':doi,'arxiv_id':'','pmid':'','stage':'','source_url':'','downloaded':False,'identity':'','title_score':'','observed_dois':'','error':''}
              try:
                  # arXiv and PMID are not necessarily present in the master, so only use them if explicit columns exist.
                  for i,h in enumerate(header):
                      hl=h.lower()
                      if 'arxiv' in hl and i<len(r): entry['arxiv_id']=r[i].strip()
                      if hl in ('pmid','pubmed id','pubmed_id') and i<len(r): entry['pmid']=r[i].strip()
                  candidates=[]
                  if entry['arxiv_id']:
                      aid=entry['arxiv_id'].replace('https://arxiv.org/abs/','').replace('arXiv:','').strip()
                      candidates.append(('arxiv',f'https://arxiv.org/pdf/{aid}.pdf'))
                  if entry['pmid']:
                      pmid=re.sub(r'\D','',entry['pmid']); candidates.append(('pmc',f'https://www.ncbi.nlm.nih.gov/research/articles/PMC/?term={pmid}'))
                  if doi:
                      u=session.get(f'https://api.unpaywall.org/v2/{doi}',params={'email':os.environ['UNPAYWALL_EMAIL']},timeout=25)
                      if u.ok:
                          data=u.json()
                          best=data.get('best_oa_location') or {}
                          for key in ('url_for_pdf','url'):
                              if best.get(key): candidates.append(('unpaywall',best[key])); break
                          for loc in data.get('oa_locations') or []:
                              for key in ('url_for_pdf','url'):
                                  if loc.get(key) and loc[key] not in [x[1] for x in candidates]: candidates.append(('unpaywall',loc[key])); break
                      else: entry['error']=f'unpaywall_http_{u.status_code}'
                  for stage,url in candidates:
                      if stage=='pmc':
                          # PMID→PMC needs a lookup; do not download a search page as if it were a PDF.
                          rr=session.get('https://www.ncbi.nlm.nih.gov/pmc/utils/idconv/v1.0/',params={'ids':entry['pmid'],'format':'json'},timeout=20)
                          if rr.ok:
                              recs=rr.json().get('records',[]); pmcid=recs[0].get('pmcid') if recs else None
                              if pmcid: url=f'https://pmc.ncbi.nlm.nih.gov/articles/{pmcid}/pdf/'
                              else: continue
                          else: continue
                      path=PDFDIR/f'{rec}_{doi.replace("/","_") or "no_doi"}.pdf'
                      ok,msg=download(url,path)
                      if not ok: entry['error']=msg; path.unlink(missing_ok=True); continue
                      text=pdf_text(path); ods=sorted(observed_dois(text)); ts=title_score(title,text[:12000])
                      identity=(doi in ods) if doi else ts>=0.25
                      entry.update({'stage':stage,'source_url':url,'downloaded':True,'identity':'match' if identity else 'mismatch','title_score':f'{ts:.3f}','observed_dois':';'.join(ods)})
                      if not identity:
                          path.unlink(missing_ok=True); entry['downloaded']=False; entry['error']='identity_mismatch'
                      break
                  if not entry['stage'] and not entry['error']: entry['error']='no_oa_candidate'
              except Exception as e:
                  entry['error']=f'{type(e).__name__}:{e}'
              audit.append(entry); time.sleep(0.5)

          with (OUT/'audit.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=audit[0].keys()); w.writeheader(); w.writerows(audit)
          print('--- RESULT ---')
          for a in audit: print(a)
          print(f'correct_retrievals={sum(a["identity"]=="match" for a in audit)}/{len(audit)}')
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: research-rabbit-oa-15-record-test-${{ github.run_id }}
          path: research_rabbit_oa_test/
          if-no-files-found: error
