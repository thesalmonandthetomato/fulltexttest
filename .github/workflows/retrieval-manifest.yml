name: Retrieval manifest

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/pilot_index_100.csv'
      - 'scripts/retrieval_manifest.py'
      - '.github/workflows/retrieval-manifest.yml'

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate retrieval manifest
        run: python scripts/retrieval_manifest.py
      - name: Validate manifest shape
        run: python - <<'PY'
import json
p='outputs/retrieval_manifest.json'
d=json.load(open(p))
assert d['record_count']==100, d['record_count']
assert len(d['records'])==100
assert len({r['record_number'] for r in d['records']})==100
print('Retrieval manifest valid: 100 unique records')
PY
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-manifest
          path: outputs/retrieval_manifest.json
