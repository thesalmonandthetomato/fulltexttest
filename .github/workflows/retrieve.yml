name: Retrieve full texts
on:
  workflow_dispatch:
    inputs:
      start:
        description: First row in pilot_records.csv
        required: true
        default: '1'
      n:
        description: Number of records
        required: true
        default: '3'
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install R packages
        run: Rscript -e "install.packages(c('httr2','jsonlite'), repos='https://cloud.r-project.org')"
      - name: Syntax check
        run: Rscript -e "stopifnot(length(parse(file='R/validation.R'))>0, length(parse(file='R/retrieval.R'))>0, length(parse(file='scripts/retrieve_one.R'))>0, length(parse(file='scripts/retrieve_batch.R'))>0)"
      - name: Retrieve pilot batch
        run: Rscript scripts/retrieve_batch.R "${{ inputs.start }}" "${{ inputs.n }}"
      - name: Upload retrieval outputs
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-pilot-${{ inputs.start }}-${{ inputs.n }}
          path: outputs/
          if-no-files-found: error
