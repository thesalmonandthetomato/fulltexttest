name: OpenAlex OA PDF recovery

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pypdf lxml
      - name: Recover failed OA PDFs
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python scripts/openalex_oa_recovery.py
      - name: Upload recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openalex-oa-recovery-${{ github.run_id }}
          path: |
            recovery-results.json
            recovery-manifest.csv
            recovery-*.tar.gz
          if-no-files-found: ignore
