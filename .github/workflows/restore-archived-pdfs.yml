name: Restore previously archived PDF files
on:
  push:
    paths:
      - .github/workflows/restore-archived-pdfs.yml
      - scripts/restore_archived_pdfs.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Restore PDFs
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python scripts/restore_archived_pdfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: restored-archived-pdfs
          path: outputs/restore_archived_pdfs/*
          if-no-files-found: error
