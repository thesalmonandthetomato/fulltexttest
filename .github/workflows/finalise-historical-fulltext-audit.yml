name: Finalise historical OpenAlex DOI retrieval audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/merge_historical_fulltext_audit.R'
      - '.github/workflows/finalise-historical-fulltext-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Retrieve previous validated batch 39 manifest
        uses: actions/download-artifact@v4
        with:
          name: original-batch39-doi-audit-39591141529
          run-id: 39591141529
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded_audit
      - name: Merge and validate all 40 DOI manifests
        run: Rscript scripts/merge_historical_fulltext_audit.R
      - uses: actions/upload-artifact@v4
        with:
          name: historical-openalex-final-csv-${{ github.run_id }}
          path: outputs/historical_final/
          if-no-files-found: error
          retention-days: 90
