name: Layer 2 Google Scholar first-result full-text links

on:
  workflow_dispatch:

concurrency:
  group: layer2-google-scholar
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests beautifulsoup4

      - name: Search Google Scholar by DOI and inspect first result
        shell: python
        run: |
          import csv, json, time
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('layer2_google_scholar_results')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36',
              'Accept-Language': 'en-GB,en;q=0.9',
          })

          records = [
            ("01", "10.1021/pr049840t"),
            ("03", "10.1201/9781003077770-78"),
            ("08", "10.14288/1.0058967"),
            ("10", "10.1111/jfb.12710"),
            ("11", "10.15586/ijfs.v38i2.3600"),
            ("12", "10.6084/m9.figshare.31147177.v1"),
            ("13", "10.56093/ehyqc013"),
            ("14", "10.1007/s10750-026-06204-0"),
          ]

          def parse_first(html):
              soup = BeautifulSoup(html, 'html.parser')
              result = soup.select_one('div.gs_ri')
              if not result:
                  return None
              title_el = result.select_one('h3.gs_rt')
              links = []
              for a in result.find_all('a'):
                  label = a.get_text(' ', strip=True)
                  if label in ('[PDF]', '[HTML]') and a.get('href'):
                      item = {'label': label, 'url': urljoin('https://scholar.google.com/', a['href'])}
                      if item not in links:
                          links.append(item)
              return {
                  'title': title_el.get_text(' ', strip=True) if title_el else '',
                  'result_url': title_el.find('a').get('href') if title_el and title_el.find('a') else '',
                  'fulltext_links': links,
              }

          audit = []
          for n, doi in records:
              row = {'record': n, 'doi': doi, 'search_url': '', 'http': None, 'first_result_found': False, 'first_result_title': '', 'pdf_links': 0, 'html_links': 0, 'fulltext_links': []}
              try:
                  url = 'https://scholar.google.com/scholar?q=' + quote_plus('"' + doi + '"') + '&hl=en&num=10'
                  row['search_url'] = url
                  r = s.get(url, timeout=60)
                  row['http'] = r.status_code
                  (OUT / f'{n}_scholar_search.html').write_text(r.text, encoding='utf-8')
                  if r.ok:
                      parsed = parse_first(r.text)
                      if parsed:
                          row['first_result_found'] = True
                          row['first_result_title'] = parsed['title']
                          row['result_url'] = parsed['result_url']
                          row['fulltext_links'] = parsed['fulltext_links']
                          row['pdf_links'] = sum(x['label'] == '[PDF]' for x in parsed['fulltext_links'])
                          row['html_links'] = sum(x['label'] == '[HTML]' for x in parsed['fulltext_links'])
                          (OUT / f'{n}_first_result.json').write_text(json.dumps(parsed, indent=2, ensure_ascii=False), encoding='utf-8')
              except Exception as e:
                  row['error'] = repr(e)
              audit.append(row)
              print(f"[{n}] {doi}: HTTP={row['http']} first_result={row['first_result_found']} PDF={row['pdf_links']} HTML={row['html_links']}")
              time.sleep(8)

          fields = ['record','doi','search_url','http','first_result_found','first_result_title','pdf_links','html_links','fulltext_links','result_url','error']
          with (OUT / 'audit.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              w.writeheader()
              for row in audit:
                  rr = dict(row)
                  rr['fulltext_links'] = json.dumps(rr.get('fulltext_links', []), ensure_ascii=False)
                  w.writerow(rr)
          (OUT / 'audit.json').write_text(json.dumps(audit, indent=2, ensure_ascii=False), encoding='utf-8')
          print('Completed Google Scholar first-result full-text-link check.')
          print('This layer identifies [PDF]/[HTML] links on the first Scholar result only; it does not download or verify the article.')

      - name: Upload Google Scholar results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer2-google-scholar-results-${{ github.run_id }}
          path: layer2_google_scholar_results/
          if-no-files-found: warn
