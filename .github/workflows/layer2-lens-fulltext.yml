name: Layer 2 Lens full-text URL retrieval

on:
  workflow_dispatch:

concurrency:
  group: layer2-lens-fulltext
  cancel-in-progress: false

env:
  LENS_API_KEY: ${{ secrets.LENS_API_KEY }}

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests

      - name: Verify dependencies and Lens secret
        shell: bash
        env:
          LENS_API_KEY: ${{ secrets.LENS_API_KEY }}
        run: |
          set -euo pipefail
          python -c "import requests; print('requests', requests.__version__)"
          test -n "$LENS_API_KEY" || (echo 'LENS_API_KEY secret is missing' && exit 1)

      - name: Retrieve Lens URLs and attempt all candidate full-text downloads
        shell: python
        env:
          LENS_API_KEY: ${{ secrets.LENS_API_KEY }}
        run: |
          import csv, json, os, re, time
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          OUT = Path('layer2_lens_results')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'fulltexttest/layer2-lens/3.0'})
          token = os.environ['LENS_API_KEY']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          records = [
            ("01", "10.1021/pr049840t", "Application of isotope coded affinity tag (ICAT) analysis for the identification of differentially expressed proteins following infection of atlantic salmon (Salmo salar) with infectious hematopoietic necrosis virus (IHNV) or Renibacterium salmoninarum (BKD)"),
            ("03", "10.1201/9781003077770-78", "Fish Farming Technology - Biological basis for landbased farming of Atlantic salmon: Growth"),
            ("08", "10.14288/1.0058967", "Physico-chemical aspects of sediment recovery at two abandoned salmon farm sites in British Columbia"),
            ("10", "10.1111/jfb.12710", "Chronic stress of rainbow trout Oncorhynchus mykiss at high altitude: a field study"),
            ("11", "10.15586/ijfs.v38i2.3600", "Environmental effects on nutrient composition of Turkish Salmon (Oncorhynchus mykiss): a comparison between marine and reservoir systems"),
            ("12", "10.6084/m9.figshare.31147177.v1", "Salmon"),
            ("13", "10.56093/ehyqc013", "Pathology of Aeromonas hydrophila infection in rainbow trout (Oncorhynchus mykiss) of Himachal Pradesh"),
            ("14", "10.1007/s10750-026-06204-0", "Ecological patterns of benthic communities in relation to salmon aquaculture in the Inner Sea of Chiloé (southern Chile)"),
          ]

          def norm_doi(s):
              s = (s or '').strip().lower()
              s = re.sub(r'^https?://doi.org/', '', s)
              s = re.sub(r'^doi:\s*', '', s)
              return s.rstrip(' .;,')

          def lens_search(doi):
              body = {
                  'query': {'match': {'doi': doi}},
                  'size': 10,
                  'include': ['lens_id', 'title', 'external_ids', 'source_urls', 'full_text']
              }
              for attempt in range(5):
                  r = session.post('https://api.lens.org/scholarly/search', headers=headers, json=body, timeout=60)
                  if r.status_code not in (429, 500, 502, 503, 504):
                      return r
                  if attempt < 4:
                      time.sleep(min(30, 2 ** attempt))
              return r

          def download(url):
              for attempt in range(5):
                  r = session.get(url, timeout=60, allow_redirects=True)
                  if r.status_code not in (429, 500, 502, 503, 504):
                      return r
                  if attempt < 4:
                      time.sleep(min(30, 2 ** attempt))
              return r

          def safe_ext(url, content_type):
              path = urlparse(url).path.lower()
              ct = (content_type or '').lower()
              if path.endswith('.pdf') or 'application/pdf' in ct: return '.pdf'
              if path.endswith('.xml') or 'xml' in ct: return '.xml'
              if 'html' in ct or path.endswith('.html') or path.endswith('.htm'): return '.html'
              return '.bin'

          audit = []
          for n, doi, title in records:
              row = {'record': n, 'doi': doi, 'database_title': title, 'lens_http': None, 'lens_result_count': 0, 'lens_exact_doi_results': 0, 'urls_found': 0, 'attempts': []}
              try:
                  r = lens_search(doi)
                  row['lens_http'] = r.status_code
                  (OUT / f'{n}_lens_search.json').write_text(r.text, encoding='utf-8')
                  data = r.json() if r.ok else {}
                  hits = data.get('data', []) or data.get('results', [])
                  row['lens_result_count'] = len(hits)
                  exact = []
                  for h in hits:
                      ids = h.get('external_ids', []) or []
                      if isinstance(ids, dict):
                          ids = [ids]
                      dois = [x.get('value', '') for x in ids if isinstance(x, dict) and str(x.get('type', '')).lower() == 'doi']
                      if norm_doi(h.get('doi', '')) == norm_doi(doi) or any(norm_doi(x) == norm_doi(doi) for x in dois):
                          exact.append(h)
                  row['lens_exact_doi_results'] = len(exact)
                  if exact:
                      h = exact[0]
                      row['lens_id'] = h.get('lens_id', '')
                      row['lens_title'] = h.get('title', '')
                      source_urls = h.get('source_urls', []) or []
                      row['urls_found'] = len(source_urls)
                      (OUT / f'{n}_lens_record.json').write_text(json.dumps(h, indent=2, ensure_ascii=False), encoding='utf-8')
                      for i, su in enumerate(source_urls, 1):
                          url = su.get('url', '') if isinstance(su, dict) else str(su)
                          typ = su.get('type', '') if isinstance(su, dict) else ''
                          if not url:
                              continue
                          att = {'rank': i, 'url': url, 'type': typ}
                          try:
                              rr = download(url)
                              att['http'] = rr.status_code
                              att['final_url'] = rr.url
                              att['content_type'] = rr.headers.get('content-type', '')
                              att['bytes'] = len(rr.content)
                              if rr.ok and len(rr.content) >= 10000:
                                  fname = f'{n}_lens_{i}{safe_ext(rr.url, rr.headers.get("content-type", ""))}'
                                  (OUT / fname).write_bytes(rr.content)
                                  att['file'] = fname
                                  att['substantial'] = True
                              else:
                                  att['substantial'] = False
                          except Exception as e:
                              att['error'] = repr(e)
                          row['attempts'].append(att)
              except Exception as e:
                  row['error'] = repr(e)
              audit.append(row)
              print(f"[{n}] {doi}: Lens HTTP={row['lens_http']} exact={row['lens_exact_doi_results']} URLs={row['urls_found']} attempts={len(row['attempts'])}")
              time.sleep(1)

          for row in audit:
              row['attempts_json'] = json.dumps(row.get('attempts', []), ensure_ascii=False)
          fields = ['record', 'doi', 'database_title', 'lens_http', 'lens_result_count', 'lens_exact_doi_results', 'lens_id', 'lens_title', 'urls_found', 'attempts_json', 'error']
          with (OUT / 'audit.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              w.writeheader()
              w.writerows(audit)
          (OUT / 'audit.json').write_text(json.dumps(audit, indent=2, ensure_ascii=False), encoding='utf-8')
          print('Completed Layer 2 Lens URL retrieval.')
          print('No automated article identity/completeness judgement has been made.')

      - name: Upload Layer 2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer2-lens-results-${{ github.run_id }}
          path: layer2_lens_results/
          if-no-files-found: warn
