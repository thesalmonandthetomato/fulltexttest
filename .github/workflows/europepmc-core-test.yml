name: Europe PMC + CORE raw DOI retrieval

on:
  workflow_dispatch:

concurrency:
  group: europepmc-core-raw
  cancel-in-progress: false

env:
  CORE_API_KEY: ${{ secrets.CORE_API_KEY }}

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve raw API results for all 15 records
        shell: python
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
        run: |
          import csv, json, os, re, time
          from pathlib import Path
          import requests

          OUT = Path('epmc_core_raw')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers['User-Agent'] = 'fulltexttest/epmc-core-raw/1.0'

          records = [
            ("10.1021/pr049840t", "Application of isotope coded affinity tag (ICAT) analysis for the identification of differentially expressed proteins following infection of atlantic salmon (Salmo salar) with infectious hematopoietic necrosis virus (IHNV) or Renibacterium salmoninarum (BKD)"),
            ("10.1002/fsh.10985", "Inadvertent Hatchery Rainbow Trout Oncorhynchus mykiss Discovered in Native Westslope Cutthroat Trout Oncorhynchus clarkii lewisi Habitat: A Cautionary Tale"),
            ("10.1201/9781003077770-78", "Fish Farming Technology - Biological basis for landbased farming of Atlantic salmon: Growth"),
            ("10.2458/v24i1.20963", "Petri dishes of an archipelago: the ecological rubble of the Chilean salmon farming industry"),
            ("10.1007/s11160-022-09714-x", "A review of marine stressors impacting Atlantic salmon Salmo salar, with an assessment of the major threats to English stocks"),
            ("10.3354/dao01972", "Real-time PCR detection of Moritella viscosa, the likely causal agent of winter-ulcer in Atlantic salmon Salmo salar and rainbow trout Oncorhynchus mykiss"),
            ("10.18174/371265", "Next-generation salmonid alphavirus vaccine development"),
            ("10.14288/1.0058967", "Physico-chemical aspects of sediment recovery at two abandoned salmon farm sites in British Columbia"),
            ("10.1038/s41598-019-39080-x", "Wound healing in post-smolt Atlantic salmon (Salmo salar L.)"),
            ("10.1111/jfb.12710", "Chronic stress of rainbow trout Oncorhynchus mykiss at high altitude: a field study"),
            ("10.15586/ijfs.v38i2.3600", "Environmental effects on nutrient composition of Turkish Salmon (Oncorhynchus mykiss): a comparison between marine and reservoir systems"),
            ("10.6084/m9.figshare.31147177.v1", "Salmon"),
            ("10.56093/ehyqc013", "Pathology of Aeromonas hydrophila infection in rainbow trout (Oncorhynchus mykiss) of Himachal Pradesh"),
            ("10.1007/s10750-026-06204-0", "Ecological patterns of benthic communities in relation to salmon aquaculture in the Inner Sea of Chiloé (southern Chile)"),
            ("", "Sinop Yöresinde Denizde Kafeslerde Farklı Yemlerle Yapılan Gökkuşağı Alabalığı (Oncorhynchus mykiss W. 1792) Yetiştiriciliği Üzerine Bir Araştırma")
          ]

          def norm_doi(s):
              s = (s or '').strip().lower()
              s = re.sub(r'^https?://doi.org/', '', s)
              s = re.sub(r'^doi:\s*', '', s)
              return s.rstrip(' .;,')

          def request(url, **kwargs):
              for attempt in range(4):
                  r = session.get(url, timeout=60, **kwargs)
                  if r.status_code not in (429, 500, 502, 503, 504):
                      return r
                  if attempt < 3:
                      time.sleep(2 ** attempt)
              return r

          audit = []
          for n, (doi, title) in enumerate(records, 1):
              stem = f'{n:02d}'
              row = {'n': n, 'doi': doi, 'database_title': title}

              # EUROPE PMC: save the complete search JSON exactly as returned.
              if doi:
                  try:
                      q = requests.utils.quote(f'DOI:"{doi}"')
                      url = f'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query={q}&format=json'
                      r = request(url)
                      row['epmc_search_http'] = r.status_code
                      (OUT / f'{stem}_europepmc_search.json').write_text(r.text, encoding='utf-8')

                      data = r.json() if r.ok else {}
                      hits = data.get('resultList', {}).get('result', [])
                      row['epmc_result_count'] = len(hits)
                      exact = [h for h in hits if norm_doi(h.get('doi', '')) == norm_doi(doi)]
                      row['epmc_exact_doi_results'] = len(exact)
                      if exact:
                          pmcid = exact[0].get('pmcid') or ''
                          row['epmc_pmcid'] = pmcid
                          row['epmc_api_title'] = exact[0].get('title', '')
                          if pmcid:
                              xr = request(f'https://www.ebi.ac.uk/europepmc/webservices/rest/{pmcid}/fullTextXML')
                              row['epmc_fulltext_http'] = xr.status_code
                              if xr.ok:
                                  (OUT / f'{stem}_europepmc_fulltext.xml').write_bytes(xr.content)
                                  row['epmc_fulltext_file'] = f'{stem}_europepmc_fulltext.xml'
                  except Exception as e:
                      row['epmc_error'] = repr(e)
              else:
                  row['epmc_search_http'] = ''
                  row['epmc_result_count'] = ''
                  row['epmc_exact_doi_results'] = ''
                  row['epmc_note'] = 'No DOI supplied; no Europe PMC DOI query performed.'

              # CORE: save the complete search JSON exactly as returned.
              try:
                  key = os.environ.get('CORE_API_KEY', '')
                  if not key:
                      row['core_error'] = 'CORE_API_KEY missing'
                  else:
                      query = f'doi:"{doi}"' if doi else f'title:"{title}"'
                      r = request(
                          'https://api.core.ac.uk/v3/search/works',
                          params={'q': query, 'limit': 10},
                          headers={'Authorization': f'Bearer {key}'}
                      )
                      row['core_search_http'] = r.status_code
                      # Raw response is saved; the API key is not part of the response.
                      (OUT / f'{stem}_core_search.json').write_text(r.text, encoding='utf-8')
                      data = r.json() if r.ok else {}
                      hits = data.get('results', []) or data.get('data', [])
                      row['core_result_count'] = len(hits)
                      exact = [h for h in hits if norm_doi(h.get('doi') or h.get('metadata', {}).get('doi') or '') == norm_doi(doi)] if doi else []
                      row['core_exact_doi_results'] = len(exact)
                      if exact:
                          h = exact[0]
                          row['core_api_title'] = h.get('title') or h.get('metadata', {}).get('title') or ''
                          row['core_api_doi'] = h.get('doi') or h.get('metadata', {}).get('doi') or ''
                          row['core_id'] = h.get('id', '')
              except Exception as e:
                  row['core_error'] = repr(e)

              audit.append(row)
              print(f'[{n}/15] {doi or "NO DOI"}')
              time.sleep(1)

          fields = [
              'n','doi','database_title',
              'epmc_search_http','epmc_result_count','epmc_exact_doi_results','epmc_pmcid','epmc_api_title','epmc_fulltext_http','epmc_fulltext_file','epmc_error','epmc_note',
              'core_search_http','core_result_count','core_exact_doi_results','core_id','core_api_doi','core_api_title','core_error'
          ]
          with (OUT / 'audit.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              w.writeheader(); w.writerows(audit)
          (OUT / 'audit.json').write_text(json.dumps(audit, indent=2, ensure_ascii=False), encoding='utf-8')

          print('\nCompleted raw retrieval for all 15 records.')
          print('No automated full-text/identity judgement has been made.')

      - name: Package raw results for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europepmc-core-raw-results-${{ github.run_id }}
          path: epmc_core_raw/
          if-no-files-found: warn
