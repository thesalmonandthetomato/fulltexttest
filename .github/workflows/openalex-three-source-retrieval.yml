name: DOI full-text retrieval — OpenAlex + Europe PMC + Unpaywall

on:
  workflow_dispatch:

concurrency:
  group: doi-fulltext-retrieval
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {doi: '10.1016/j.chemosphere.2008.01.030', artifact_id: '10.1016_j.chemosphere.2008.01.030', title: 'Polybrominated diphenyl ethers (PBDEs) in farmed and wild salmon marketed in the Northeastern United States'}
          - {doi: '10.1186/s12862-018-1294-y', artifact_id: '10.1186_s12862-018-1294-y', title: 'Implications for introgression: has selection for fast growth altered the size threshold for precocious male maturation in domesticated Atlantic salmon?'}
          - {doi: '10.1128/aac.48.10.3912-3917.2004', artifact_id: '10.1128_aac.48.10.3912-3917.2004', title: 'Long depletion time of enrofloxacin in rainbow trout (Oncorhynchus mykiss)'}
          - {doi: '10.1111/j.1365-2761.2012.01359.x', artifact_id: '10.1111_j.1365-2761.2012.01359.x', title: 'Simultaneous detection of the IPN and ISA viruses in outbreaks of clinical disease and mortality in farmed Atlantic salmon, Salmo salar L., in Chile'}
          - {doi: '10.1115/omae2017-61845', artifact_id: '10.1115_omae2017-61845', title: 'Risk Management in Aquaculture: Integrating Sustainability Perspectives'}
          - {doi: '10.1016/j.gloenvcha.2010.04.001', artifact_id: '10.1016_j.gloenvcha.2010.04.001', title: 'The political ecology of Chilean salmon aquaculture, 1982–2010: A trajectory from economic development to global sustainability'}
          - {doi: '10.3390/ani11071974', artifact_id: '10.3390_ani11071974', title: 'Influence of Infectious Pancreatic Necrosis Virus and Yersinia ruckeri Co-Infection on a Non-Specific Immune System in Rainbow Trout (Oncorhynchus mykiss)'}
          - {doi: '10.1016/j.aquaculture.2013.04.002', artifact_id: '10.1016_j.aquaculture.2013.04.002', title: 'Comparison of the fecundity rate of Caligus rogercresseyi infesting Atlantic salmon (Salmo salar L.) on farms in two regions of Chile'}
          - {doi: '10.1016/j.aquaculture.2025.743137', artifact_id: '10.1016_j.aquaculture.2025.743137', title: 'The efficacy of lumpfish in controlling salmon lice in fish farms'}
          - {doi: '10.1016/j.aquaculture.2020.735980', artifact_id: '10.1016_j.aquaculture.2020.735980', title: 'Effects of selenium-enriched prebiotic on the growth performance, innate immune response, oxidative enzyme activity and microbiome of rainbow trout (Oncorhynchus mykiss)'}
          - {doi: '10.1016/b978-0-12-550755-4.50026-4', artifact_id: '10.1016_b978-0-12-550755-4.50026-4', title: 'Paramoebic Gill Infection and Associated Pathology of Atlantic Salmon, Salmo Salar, and Rainbow Trout, Salmo Gairdneri, in Tasmania'}
          - {doi: '10.52419/issn2782-6252.2022.1.38', artifact_id: '10.52419_issn2782-6252.2022.1.38', title: 'Myxobacterioses of salmon and sturgeon fish Comments to the Order of the Ministry of Agriculture of the Russian Federation No. 644 dated 22.09.2021'}
          - {doi: '10.1101/026583', artifact_id: '10.1101_026583', title: 'A Model For Sea Lice (Lepeophtheirus salmonis) Dynamics In A Seasonally Changing Environment'}
          - {doi: '10.1093/femsec/fiac076', artifact_id: '10.1093_femsec_fiac076', title: 'Glyphosate-based herbicide exposure: effects on gill microbiota of rainbow trout (Oncorhynchus mykiss) and the aquatic bacterial ecosystem'}
          - {doi: '10.3389/fvets.2018.00269', artifact_id: '10.3389_fvets.2018.00269', title: 'The Use of Kernel Density Estimation With a Bio-Physical Model Provides a Method to Quantify Connectivity Among Salmon Farms: Spatial Planning and Management With Epidemiological Relevance'}
          - {doi: '10.1111/j.1745-4514.2005.00015.x', artifact_id: '10.1111_j.1745-4514.2005.00015.x', title: 'Physicochemical Properties of Muscle and Natural Actomyosin Extracted from Farmed Atlantic Salmon (Salmo Salar) Stored at 4c'}
          - {doi: '10.1021/acs.est.8b00146', artifact_id: '10.1021_acs.est.8b00146', title: 'Polybrominated Diphenyl Ether (PBDE) Accumulation in Farmed Salmon Evaluated Using a Dynamic Sea-Cage Production Model'}
          - {doi: '10.3390/biology15020163', artifact_id: '10.3390_biology15020163', title: 'Dietary Methionine Supplementation Improves Rainbow Trout (Oncorhynchus mykiss) Immune Responses Against Viral Haemorrhagic Septicaemia Virus (VHSV).'}
          - {doi: '10.1101/2021.03.15.435234', artifact_id: '10.1101_2021.03.15.435234', title: 'The salmon louse genome: copepod features and parasitic adaptations'}
          - {doi: '10.1111/j.1749-7345.2010.00349.x', artifact_id: '10.1111_j.1749-7345.2010.00349.x', title: 'Toward Improved Public Confidence in Farmed Fish Quality: A Canadian Perspective on the Consequences of Diet Selection'}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests lxml pypdf
      - name: Retrieve and parse full text
        shell: python
        env:
          DOI_INPUT: ${{ matrix.doi }}
          TITLE_INPUT: ${{ matrix.title }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          import json, os, re, time
          from pathlib import Path
          import requests
          from lxml import etree
          from pypdf import PdfReader
          OUT=Path('fulltext_output'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'fulltexttest/doi-fulltext-retrieval/1.2','Accept-Language':'en-GB,en;q=0.9'})
          def norm_doi(x):
              x=(x or '').strip().lower(); x=re.sub(r'^https?://doi.org/','',x); x=re.sub(r'^doi:\s*','',x); return x.rstrip(' .;,')
          doi=norm_doi(os.environ['DOI_INPUT']); expected_title=os.environ.get('TITLE_INPUT','').strip()
          if not re.match(r'^10\.\d{4,9}/\S+$',doi): raise SystemExit(f'Invalid DOI: {doi}')
          def get(url,**kw):
              for i in range(5):
                  r=s.get(url,timeout=60,allow_redirects=True,**kw)
                  if r.status_code not in (429,500,502,503,504) or i==4: return r
                  time.sleep(2**i)
          def parse_pdf(data):
              p=OUT/'source.pdf'; p.write_bytes(data)
              try:
                  r=PdfReader(str(p)); pages=[x.extract_text() or '' for x in r.pages]; return '\n\n'.join(pages),len(pages)
              finally: p.unlink(missing_ok=True)
          def parse_xml(data):
              root=etree.fromstring(data)
              def txt(xpath): return '\n'.join(' '.join(''.join(n.itertext()).split()) for n in root.xpath(xpath)).strip()
              title=txt('//*[local-name()="titleStmt"]//*[local-name()="title"] | //*[local-name()="article-title"]'); abstract=txt('//*[local-name()="abstract"]'); body=txt('//*[local-name()="body"]'); refs=txt('//*[local-name()="listBibl"]'); return title,abstract,body,refs
          def usable_pdf(data):
              try: text,pages=parse_pdf(data); return len(text)>=3000 and pages>=1,text,pages
              except Exception: return False,'',0
          def usable_xml(data):
              try: title,abstract,body,refs=parse_xml(data); text='\n\n'.join(x for x in (title,abstract,body,refs) if x); return len(body)>=3000,text,title
              except Exception: return False,'',''
          audit={'doi':doi,'input_title':expected_title,'verified_complete':False,'selected_source':None,'source_url':None,'openalex':{},'europepmc':{},'unpaywall':{},'attempts':[]}
          candidates=[]
          try:
              r=get(f'https://api.openalex.org/works/https://doi.org/{requests.utils.quote(doi)}'); audit['openalex']['http']=r.status_code
              if r.ok:
                  w=r.json(); audit['openalex'].update({'id':w.get('id'),'doi':w.get('doi'),'title':w.get('display_name'),'publication_year':w.get('publication_year'),'type':w.get('type'),'is_oa':w.get('open_access',{}).get('is_oa'),'has_content':w.get('has_content',{}),'best_oa_location':w.get('best_oa_location')})
                  key=os.environ.get('OPENALEX_API_KEY',''); wid=(w.get('id') or '').rstrip('/').split('/')[-1]
                  if key and wid:
                      if w.get('has_content',{}).get('grobid_xml'):
                          rr=get(f'https://content.openalex.org/works/{wid}.grobid-xml',params={'api_key':key}); audit['openalex']['tei_http']=rr.status_code
                          if rr.ok and rr.content: candidates.append(('OpenAlex TEI',rr.url,rr.content,'xml'))
                      if w.get('has_content',{}).get('pdf'):
                          rr=get(f'https://content.openalex.org/works/{wid}.pdf',params={'api_key':key}); audit['openalex']['pdf_http']=rr.status_code
                          if rr.ok and rr.content.startswith(b'%PDF'): candidates.append(('OpenAlex PDF',rr.url,rr.content,'pdf'))
                  for loc in [w.get('best_oa_location')]+(w.get('locations') or []):
                      if loc:
                          u=(loc.get('pdf_url') or loc.get('landing_page_url') or '').strip()
                          if u.startswith('http'): candidates.append(('OpenAlex OA location',u,None,'url'))
          except Exception as e: audit['openalex']['error']=repr(e)
          try:
              q=requests.utils.quote(f'DOI:"{doi}"'); r=get(f'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query={q}&resultType=core&format=json'); audit['europepmc']['http']=r.status_code
              if r.ok:
                  hits=r.json().get('resultList',{}).get('result',[]); exact=[h for h in hits if norm_doi(h.get('doi'))==doi]; audit['europepmc']['matched']=bool(exact); audit['europepmc']['pmcid']=exact[0].get('pmcid') if exact else None
                  if exact and exact[0].get('pmcid'):
                      rr=get(f'https://www.ebi.ac.uk/europepmc/webservices/rest/{exact[0]["pmcid"]}/fullTextXML'); audit['europepmc']['fulltext_http']=rr.status_code
                      if rr.ok and rr.content: candidates.append(('Europe PMC XML',rr.url,rr.content,'xml'))
          except Exception as e: audit['europepmc']['error']=repr(e)
          try:
              email=os.environ.get('UNPAYWALL_EMAIL') or 'fulltexttest@example.org'; r=get(f'https://api.unpaywall.org/v2/{requests.utils.quote(doi)}',params={'email':email}); audit['unpaywall']['http']=r.status_code
              if r.ok:
                  data=r.json(); locs=[]
                  if data.get('best_oa_location'): locs.append(data['best_oa_location'])
                  locs.extend(data.get('oa_locations') or []); urls=[]; seen=set()
                  for loc in locs:
                      for k in ('url_for_pdf','url_for_landing_page','url'):
                          u=(loc.get(k) or '').strip()
                          if u.startswith('http') and u not in seen: seen.add(u); urls.append(u); candidates.append(('Unpaywall',u,None,'url'))
                  audit['unpaywall']['locations']=urls
          except Exception as e: audit['unpaywall']['error']=repr(e)
          seen=set()
          for source,url,data,kind in candidates:
              if url in seen: continue
              seen.add(url)
              if data is None:
                  rr=get(url); data=rr.content; final_url=rr.url; status=rr.status_code; ctype=rr.headers.get('content-type','')
              else: final_url=url; status=200; ctype='application/'+kind
              attempt={'source':source,'url':url,'final_url':final_url,'http':status,'content_type':ctype}
              if status>=400 or not data: attempt['result']='download_failed'; audit['attempts'].append(attempt); continue
              try:
                  is_xml=kind=='xml' or 'xml' in ctype.lower() or data.lstrip().startswith(b'<?xml') or b'<article' in data[:1000]
                  if is_xml:
                      ok,text,title=usable_xml(data); attempt.update({'representation':'XML','title':title,'text_chars':len(text),'complete':ok})
                      if ok: (OUT/'fulltext.txt').write_text(text,encoding='utf-8'); (OUT/'fulltext.xml').write_bytes(data)
                  else:
                      ok,text,pages=usable_pdf(data); attempt.update({'representation':'PDF','pages':pages,'text_chars':len(text),'complete':ok})
                      if ok: (OUT/'fulltext.txt').write_text(text,encoding='utf-8'); (OUT/'fulltext.pdf').write_bytes(data)
                  audit['attempts'].append(attempt)
                  if ok: audit.update({'verified_complete':True,'selected_source':source,'source_url':final_url}); break
              except Exception as e: attempt.update({'result':'parse_error','error':repr(e)}); audit['attempts'].append(attempt)
          (OUT/'metadata.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False),encoding='utf-8')
          if not audit['verified_complete']: print(json.dumps(audit,indent=2)); raise SystemExit('No usable parsed full text retrieved')
          print(json.dumps(audit,indent=2))
      - name: Upload parsed full text and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-${{ matrix.artifact_id }}-${{ github.run_id }}
          path: fulltext_output/
          if-no-files-found: warn

  summarize:
    if: always()
    needs: retrieve
    runs-on: ubuntu-22.04
    steps:
      - name: Download all per-DOI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fulltext-*-${{ github.run_id }}
          path: collected
          merge-multiple: false
      - name: Build consolidated results
        shell: python
        run: |
          import csv,json,glob
          rows=[]; details=[]
          for p in glob.glob('collected/**/metadata.json',recursive=True):
              d=json.load(open(p,encoding='utf-8')); rows.append({'doi':d.get('doi'),'verified_complete':d.get('verified_complete'),'selected_source':d.get('selected_source'),'openalex_http':d.get('openalex',{}).get('http'),'openalex_pdf_http':d.get('openalex',{}).get('pdf_http'),'europepmc_http':d.get('europepmc',{}).get('http'),'europepmc_matched':d.get('europepmc',{}).get('matched'),'europepmc_fulltext_http':d.get('europepmc',{}).get('fulltext_http'),'unpaywall_http':d.get('unpaywall',{}).get('http'),'unpaywall_locations':len(d.get('unpaywall',{}).get('locations',[])),'attempt_count':len(d.get('attempts',[]))}); details.append(d)
          rows.sort(key=lambda x:x['doi'] or '')
          with open('batch-results.csv','w',newline='',encoding='utf-8') as f: w=csv.DictWriter(f,fieldnames=rows[0].keys() if rows else ['doi']); w.writeheader(); w.writerows(rows)
          json.dump(details,open('batch-results.json','w',encoding='utf-8'),indent=2,ensure_ascii=False)
      - name: Upload consolidated batch results
        uses: actions/upload-artifact@v4
        with:
          name: batch-results-${{ github.run_id }}
          path: |
            batch-results.csv
            batch-results.json
