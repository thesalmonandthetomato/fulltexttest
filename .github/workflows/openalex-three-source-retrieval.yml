name: DOI full-text retrieval — OpenAlex + Europe PMC + Unpaywall

on:
  workflow_dispatch:
    inputs:
      doi:
        description: DOI to retrieve
        required: true
        type: string
      title:
        description: Optional expected article title for identity checking
        required: false
        type: string

concurrency:
  group: doi-fulltext-retrieval
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests lxml pypdf

      - name: Retrieve and parse full text
        shell: python
        env:
          DOI_INPUT: ${{ inputs.doi }}
          TITLE_INPUT: ${{ inputs.title }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: |
          import json, os, re, time
          from pathlib import Path
          import requests
          from lxml import etree
          from pypdf import PdfReader

          OUT=Path('fulltext_output'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'fulltexttest/doi-fulltext-retrieval/1.0','Accept-Language':'en-GB,en;q=0.9'})

          def norm_doi(x):
              x=(x or '').strip().lower(); x=re.sub(r'^https?://doi.org/','',x); x=re.sub(r'^doi:\s*','',x); return x.rstrip(' .;,')
          doi=norm_doi(os.environ['DOI_INPUT'])
          if not re.match(r'^10\.\d{4,9}/\S+$',doi): raise SystemExit(f'Invalid DOI: {doi}')
          expected_title=os.environ.get('TITLE_INPUT','').strip()

          def get(url, **kw):
              for i in range(5):
                  r=s.get(url,timeout=60,allow_redirects=True,**kw)
                  if r.status_code not in (429,500,502,503,504) or i==4: return r
                  time.sleep(2**i)

          def title_score(a,b):
              A=set(re.sub(r'[^a-z0-9]+',' ',a.lower()).split()); B=set(re.sub(r'[^a-z0-9]+',' ',b.lower()).split())
              return len(A&B)/max(1,len(A|B))

          def parse_pdf(data):
              p=OUT/'source.pdf'; p.write_bytes(data)
              try:
                  r=PdfReader(str(p)); return '\n\n'.join((x.extract_text() or '') for x in r.pages),len(r.pages)
              finally: p.unlink(missing_ok=True)

          def parse_tei(data):
              root=etree.fromstring(data)
              def txt(nodes): return '\n'.join(' '.join(''.join(n.itertext()).split()) for n in nodes if n is not None).strip()
              title=txt(root.xpath('//*[local-name()="titleStmt"]//*[local-name()="title"] | //*[local-name()="article-title"]'))
              abstract=txt(root.xpath('//*[local-name()="abstract"]'))
              body=txt(root.xpath('//*[local-name()="body"]'))
              refs=txt(root.xpath('//*[local-name()="listBibl"]'))
              dois=[]
              for n in root.xpath('//*[local-name()="idno" and translate(@type,"DOI","doi")="doi"] | //*[local-name()="pub-id" and translate(@pub-id-type,"DOI","doi")="doi"]'):
                  d=norm_doi(' '.join(''.join(n.itertext()).split()));
                  if d: dois.append(d)
              return title,abstract,body,refs,sorted(set(dois))

          def validate_text(text):
              refs=bool(re.search(r'\b(references|bibliography|literature cited)\b',text.lower()))
              observed=sorted(set(norm_doi(x) for x in re.findall(r'10\.\d{4,9}/[-._;()/:A-Z0-9]+',text,re.I)))
              doi_match=doi in observed
              ts=title_score(expected_title,text[:15000]) if expected_title else None
              return {'text_chars':len(text),'reference_section':refs,'observed_dois':observed,'doi_match':doi_match,'title_score':ts}

          audit={'doi':doi,'expected_title':expected_title,'attempts':[],'selected_source':None,'verified_complete':False}
          candidates=[]

          # 1. OpenAlex: metadata -> GROBID TEI/PDF content API, then OA locations.
          try:
              r=get(f'https://api.openalex.org/works/https://doi.org/{requests.utils.quote(doi)}')
              audit['openalex_http']=r.status_code
              if r.ok:
                  w=r.json(); audit['openalex_id']=w.get('id'); audit['openalex_title']=w.get('display_name'); audit['openalex_has_content']=w.get('has_content',{})
                  key=os.environ.get('OPENALEX_API_KEY',''); wid=(w.get('id') or '').rstrip('/').split('/')[-1]
                  if key and wid:
                      if w.get('has_content',{}).get('grobid_xml'):
                          rr=get(f'https://content.openalex.org/works/{wid}.grobid-xml',params={'api_key':key})
                          audit['openalex_tei_http']=rr.status_code
                          if rr.ok and rr.content: candidates.append(('OpenAlex TEI',rr.url,rr.content,'xml'))
                      if w.get('has_content',{}).get('pdf'):
                          rr=get(f'https://content.openalex.org/works/{wid}.pdf',params={'api_key':key})
                          audit['openalex_pdf_http']=rr.status_code
                          if rr.ok and rr.content.startswith(b'%PDF'): candidates.append(('OpenAlex PDF',rr.url,rr.content,'pdf'))
                  for loc in [w.get('best_oa_location')]+(w.get('locations') or []):
                      if not loc: continue
                      u=(loc.get('pdf_url') or loc.get('landing_page_url') or '').strip()
                      if u.startswith('http'): candidates.append(('OpenAlex OA location',u,None,'url'))
          except Exception as e: audit['openalex_error']=repr(e)

          # 2. Europe PMC: exact DOI -> PMCID -> canonical full-text XML.
          try:
              q=requests.utils.quote(f'DOI:"{doi}"')
              r=get(f'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query={q}&resultType=core&format=json')
              audit['europepmc_http']=r.status_code
              if r.ok:
                  hits=r.json().get('resultList',{}).get('result',[]); exact=[h for h in hits if norm_doi(h.get('doi'))==doi]
                  if exact and exact[0].get('pmcid'):
                      pmcid=exact[0]['pmcid']; rr=get(f'https://www.ebi.ac.uk/europepmc/webservices/rest/{pmcid}/fullTextXML')
                      audit['europepmc_fulltext_http']=rr.status_code
                      if rr.ok and rr.content: candidates.append(('Europe PMC XML',rr.url,rr.content,'xml'))
          except Exception as e: audit['europepmc_error']=repr(e)

          # 3. Unpaywall: OA locations, tried in ranked order.
          try:
              email=os.environ.get('UNPAYWALL_EMAIL') or 'fulltexttest@example.org'
              r=get(f'https://api.unpaywall.org/v2/{requests.utils.quote(doi)}',params={'email':email})
              audit['unpaywall_http']=r.status_code
              if r.ok:
                  data=r.json(); locs=[]
                  if data.get('best_oa_location'): locs.append(data['best_oa_location'])
                  locs.extend(data.get('oa_locations') or [])
                  seen=set()
                  for loc in locs:
                      for k in ('url_for_pdf','url'):
                          u=(loc.get(k) or '').strip()
                          if u.startswith('http') and u not in seen: seen.add(u); candidates.append(('Unpaywall',u,None,'url'))
          except Exception as e: audit['unpaywall_error']=repr(e)

          # Validate candidates uniformly; first complete, identity-matched text wins.
          seen=set()
          for source,url,data,kind in candidates:
              if url in seen: continue
              seen.add(url)
              if data is None:
                  rr=get(url); data=rr.content; final_url=rr.url; status=rr.status_code; ctype=rr.headers.get('content-type','')
              else:
                  final_url=url; status=200; ctype='application/'+kind
              attempt={'source':source,'url':url,'final_url':final_url,'http':status,'content_type':ctype}
              if status>=400 or not data: attempt['result']='download_failed'; audit['attempts'].append(attempt); continue
              try:
                  if kind=='xml' or 'xml' in ctype.lower() or data.lstrip().startswith(b'<?xml') or b'<article' in data[:1000]:
                      title,abstract,body,refs,xml_dois=parse_tei(data)
                      text='\n\n'.join(x for x in (title,abstract,body,refs) if x)
                      validation={'text_chars':len(text),'reference_count':len(re.findall(r'<biblStruct|<ref\b',data.decode('utf-8','ignore'))),'observed_dois':xml_dois,'doi_match':doi in xml_dois,'title_score':title_score(expected_title,title) if expected_title else None}
                      complete=len(body)>=5000 and validation['reference_count']>=3 and (validation['doi_match'] or not expected_title or validation['title_score']>=0.70)
                      attempt.update({'representation':'TEI/XML','title':title,'validation':validation,'complete':complete})
                      if complete:
                          (OUT/'fulltext.txt').write_text(text,encoding='utf-8'); (OUT/'fulltext.xml').write_bytes(data)
                  else:
                      text,pages=parse_pdf(data); validation=validate_text(text); complete=len(text)>=5000 and validation['reference_section'] and (validation['doi_match'] or not expected_title or (validation['title_score'] or 0)>=0.25); attempt.update({'representation':'PDF','pages':pages,'validation':validation,'complete':complete})
                      if complete:
                          (OUT/'fulltext.txt').write_text(text,encoding='utf-8'); (OUT/'fulltext.pdf').write_bytes(data)
                  audit['attempts'].append(attempt)
                  if complete:
                      audit.update({'selected_source':source,'source_url':final_url,'verified_complete':True}); break
              except Exception as e:
                  attempt.update({'result':'parse_or_validation_error','error':repr(e)}); audit['attempts'].append(attempt)

          audit['output']='fulltext.txt' if audit['verified_complete'] else None
          (OUT/'metadata.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False),encoding='utf-8')
          if not audit['verified_complete']:
              print(json.dumps(audit,indent=2)); raise SystemExit('No verified complete full text retrieved')
          print(json.dumps(audit,indent=2))

      - name: Upload parsed full text and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulltext-${{ inputs.doi }}-${{ github.run_id }}
          path: fulltext_output/
          if-no-files-found: warn
