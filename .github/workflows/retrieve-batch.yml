name: Retrieve batch

on:
  workflow_dispatch:
    inputs:
      start:
        description: First record position (1-100)
        required: true
        default: '1'
      size:
        description: Batch size
        required: true
        default: '10'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install R dependencies
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Prepare bounded retrieval batch in R
        run: Rscript R/retrieve_batch.R ${{ inputs.start }} ${{ inputs.size }}
      - name: Validate manifest shape in R
        run: Rscript -e 'x <- jsonlite::read_json(list.files("outputs", pattern="retrieval_batch_.*json", full.names=TRUE)[1]); stopifnot(length(x$records) == as.integer("${{ inputs.size }}")); cat("R manifest valid\n")'
      - name: Upload retrieval batch manifest
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-batch-${{ inputs.start }}
          path: outputs/retrieval_batch_*.json
