name: Retrieve batch

on:
  workflow_dispatch:
    inputs:
      start:
        description: First record position (1-100)
        required: true
        default: '1'
      size:
        description: Batch size
        required: true
        default: '10'

jobs:
  retrieve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("jsonlite","httr2"), repos="https://cloud.r-project.org")'
      - name: Run R full-text retrieval
        run: Rscript R/retrieve_full_texts.R ${{ inputs.start }} ${{ inputs.size }}
      - name: Validate retrieval outputs
        run: |
          Rscript - <<'RS'
          library(jsonlite)
          s <- list.files("outputs/retrieval", pattern="retrieval_status_.*json", full.names=TRUE)
          stopifnot(length(s) == 1)
          x <- fromJSON(s[[1]], simplifyDataFrame=TRUE)
          stopifnot(nrow(x$records) == as.integer(Sys.getenv("INPUT_SIZE", unset="10")))
          cat("Retrieval output structurally valid\n")
          RS
        env:
          INPUT_SIZE: ${{ inputs.size }}
      - name: Upload retrieval logs and documents
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-batch-${{ inputs.start }}
          path: |
            outputs/retrieval/**
            outputs/full_text/**
