name: Clean R full-text retrieval

on:
  workflow_dispatch:
    inputs:
      record_ids:
        description: Comma-separated record_id values; blank selects first three eligible records
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'retrieval/**'
      - 'data/living_evidence_map_master.csv'
      - '.github/workflows/clean-retrieval.yml'

permissions:
  contents: read

concurrency:
  group: fulltext-retrieval
  cancel-in-progress: true

jobs:
  retrieve:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: rocker/r-ver:4.4.2
      options: --user root

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eux
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "VERIFIED_TRIGGER_SHA=$EXPECTED_SHA"

      - name: Install runtime tools
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git curl poppler-utils ca-certificates python3 python3-pip python3-requests python3-bs4
          Rscript --version
          git --version
          curl --version
          python3 --version
          python3 -c 'import requests, bs4; print("requests", requests.__version__, "bs4", bs4.__version__)'
          pdftotext -v
          python3 -m pip install --break-system-packages --ignore-installed --no-cache-dir --disable-pip-version-check git+https://github.com/computron/fulltext-article-downloader.git
          fulltext-download --help >/dev/null
          Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org", quiet=TRUE); library(jsonlite); cat("jsonlite", as.character(packageVersion("jsonlite")), "\n")'

      - name: Verify current main before retrieval
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eux
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          HEAD_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD_SHA=$HEAD_SHA"
          echo "Current origin/main SHA=$MAIN_SHA"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$MAIN_SHA"
          echo "VERIFIED_CURRENT_MAIN_SHA=$MAIN_SHA"

      - name: Parse-check active code
        run: |
          set -eux
          Rscript -e "parse('retrieval/R/fulltext.R'); parse('retrieval/R/additive_discovery_v4.R'); parse('retrieval/run.R')"
          python3 -m py_compile retrieval/PYTHON/discovery_runner.py retrieval/PYTHON/package_downloader.py
          test ! -e retrieval/R/discovery.R
          test ! -e retrieval/R/runtime_overrides.R
          test ! -e retrieval/R/discovery_network_overrides.R
          test ! -e retrieval/R/additive_discovery_v3.R
          test -e retrieval/R/additive_discovery_v4.R
          test -e retrieval/PYTHON/discovery_runner.py
          test -e retrieval/PYTHON/package_downloader.py
          echo 'Active retrieval implementation: direct retrieval + fulltext-article-downloader fallback + targeted title discovery'

      - name: Re-check current main immediately before retrieval
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eux
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          HEAD_SHA=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD_SHA=$HEAD_SHA"
          echo "Current origin/main SHA=$MAIN_SHA"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$MAIN_SHA"
          echo 'Current-main guard passed immediately before retrieval.'

      - name: Run clean retrieval
        env:
          RECORD_IDS: ${{ inputs.record_ids }}
        run: |
          set -eux
          if [ -n "$RECORD_IDS" ]; then
            Rscript retrieval/run.R "$RECORD_IDS"
          elif [ "${{ github.event_name }}" = "push" ]; then
            Rscript retrieval/run.R "75297,83519,055-629-277-091-173,76270,124-877-357-106-340,81717,196-416-367-489-015,73596,75538,111-570-422-900-084,78217,73558,80979,75855,82364"
          else
            Rscript retrieval/run.R
          fi

      - name: Upload retrieval artefacts
        uses: actions/upload-artifact@v4
        with:
          name: clean-retrieval-${{ github.run_id }}
          path: outputs/clean_retrieval/
          if-no-files-found: error
