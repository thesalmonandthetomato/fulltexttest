name: Clean R full-text retrieval

on:
  workflow_dispatch:
    inputs:
      record_ids:
        description: Comma-separated record_id values; blank selects first three eligible records
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'retrieval/**'
      - 'data/living_evidence_map_master.csv'
      - '.github/workflows/clean-retrieval.yml'

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-22.04
    container:
      image: rocker/r-ver:4.4.2
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl poppler-utils ca-certificates
          Rscript --version
          curl --version
          pdftotext -v

      - name: Parse-check clean R code
        run: |
          set -eux
          Rscript -e "parse('retrieval/R/fulltext.R'); parse('retrieval/R/discovery.R'); parse('retrieval/run.R')"

      - name: Run clean retrieval
        env:
          RECORD_IDS: ${{ inputs.record_ids }}
        run: |
          set -eux
          if [ -n "$RECORD_IDS" ]; then
            Rscript retrieval/run.R "$RECORD_IDS"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Comparison sample used to benchmark the expanded discovery layer.
            Rscript retrieval/run.R "75297,83519,055-629-277-091-173,76270,124-877-357-106-340,81717,196-416-367-489-015,73596,75538,111-570-422-900-084,78217,73558,80979,75855,82364"
          else
            Rscript retrieval/run.R
          fi

      - name: Upload retrieval artefacts
        uses: actions/upload-artifact@v4
        with:
          name: clean-retrieval-${{ github.run_id }}
          path: outputs/clean_retrieval/
          if-no-files-found: error
