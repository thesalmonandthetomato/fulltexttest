name: Retrieve full-text pilot

on:
  workflow_dispatch:
    inputs:
      record_ids:
        description: Comma-separated record_id values from the master dataset
        required: true
        type: string

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('readr','httr2','jsonlite'), repos='https://cloud.r-project.org', dependencies=TRUE)"

      - name: Parse-check retrieval code
        run: |
          Rscript -e "files <- c('R/check_dataset.R','R/retrieval.R','scripts/run_retrieval.R'); for (f in files) parse(f)"

      - name: Validate master dataset
        run: Rscript -e "source('R/check_dataset.R'); check_dataset('data/living_evidence_map_master.csv')"

      - name: Retrieve requested records
        env:
          RECORD_IDS: ${{ inputs.record_ids }}
        run: Rscript scripts/run_retrieval.R "$RECORD_IDS"

      - name: Write run manifest
        env:
          RECORD_IDS: ${{ inputs.record_ids }}
        run: |
          mkdir -p outputs/retrieval
          printf 'run_id,commit_sha,record_ids\n%s,%s,"%s"\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RECORD_IDS" > outputs/retrieval/run_manifest.csv

      - name: Upload retrieval artefacts
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
