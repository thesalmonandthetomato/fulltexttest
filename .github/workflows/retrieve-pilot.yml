name: Retrieve full-text pilot

on:
  push:
    paths:
      - '.github/pilot.trigger'
      - '.github/workflows/retrieve-pilot.yml'
      - 'R/**'
      - 'scripts/**'
      - 'data/living_evidence_map_master.csv'
  workflow_dispatch:
    inputs:
      record_ids:
        description: Comma-separated record_id values from the master dataset; leave blank for the deterministic three-record pilot
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Check runner R
        run: |
          set -euo pipefail
          command -v Rscript
          Rscript --version
          Rscript -e "cat(as.character(getRversion()), '\\n')"
          Rscript -e "stopifnot(getRversion() >= '4.3.0')"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils libcurl4-openssl-dev libssl-dev libxml2-dev pkg-config

      - name: Verify system dependencies
        run: |
          set -euo pipefail
          command -v pdftotext
          command -v pkg-config
          pkg-config --exists libcurl

      - name: Install R packages from CRAN
        env:
          R_DEFAULT_PACKAGES: "utils,methods,stats,graphics,grDevices,datasets"
        run: |
          set -euo pipefail
          Rscript -e "options(timeout=300); install.packages(c('readr','httr2','jsonlite'), repos='https://cloud.r-project.org', type='source', Ncpus=2)"
          Rscript -e "stopifnot(requireNamespace('readr', quietly=TRUE), requireNamespace('httr2', quietly=TRUE), requireNamespace('jsonlite', quietly=TRUE))"

      - name: Parse-check retrieval code
        run: |
          set -euo pipefail
          Rscript -e "files <- c('R/check_dataset.R','R/retrieval.R','scripts/run_retrieval.R'); for (f in files) { parse(f); cat('OK:', f, '\\n') }"

      - name: Validate master dataset
        run: |
          set -euo pipefail
          Rscript -e "source('R/check_dataset.R'); x <- check_dataset('data/living_evidence_map_master.csv'); cat('Records:', nrow(x), '\\n'); cat('Columns:', ncol(x), '\\n')"

      - name: Resolve pilot selection
        env:
          INPUT_RECORD_IDS: ${{ inputs.record_ids }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RECORD_IDS" ]; then
            echo "RECORD_IDS=$INPUT_RECORD_IDS" >> "$GITHUB_ENV"
            echo "SELECTION_MODE=explicit_record_ids" >> "$GITHUB_ENV"
          else
            echo "RECORD_IDS=__FIRST3__" >> "$GITHUB_ENV"
            echo "SELECTION_MODE=deterministic_first_three_eligible" >> "$GITHUB_ENV"
          fi

      - name: Retrieve pilot records
        run: |
          set -euo pipefail
          Rscript scripts/run_retrieval.R "$RECORD_IDS"

      - name: Write run manifest
        run: |
          set -euo pipefail
          mkdir -p outputs/retrieval
          printf 'run_id,commit_sha,selection_mode,selection_argument\n%s,%s,%s,"%s"\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SELECTION_MODE" "$RECORD_IDS" > outputs/retrieval/run_manifest.csv

      - name: Upload retrieval artefacts
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
