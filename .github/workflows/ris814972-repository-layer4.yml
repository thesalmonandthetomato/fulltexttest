name: RIS 814972 repository PDF layer 4
on:
  push:
    paths:
      - '.github/workflows/ris814972-repository-layer4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and syntax check
        run: |
          python -m pip install requests pypdf
          python -m py_compile scripts/ris814972_repository_layer4.py
      - name: Retrieve verified repository PDFs
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python -u scripts/ris814972_repository_layer4.py
      - name: Preserve manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ris814972-repository-layer4-${{ github.run_id }}
          path: |
            outputs/ris814972_repository_layer4/*.csv
            outputs/ris814972_repository_layer4/*.json
          if-no-files-found: warn
