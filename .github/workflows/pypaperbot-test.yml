name: PyPaperBot 15-record test

on:
  workflow_dispatch:

concurrency:
  group: pypaperbot-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyPaperBot and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/ferru97/PyPaperBot.git
          python -m pip install undetected-chromedriver selenium scholarly requests beautifulsoup4 lxml

      - name: Prepare 15-record test corpus
        shell: bash
        run: |
          python - <<'PY'
          import csv, re
          from pathlib import Path
          src=Path('data/living_evidence_map_master.csv'); out=Path('pypaperbot_test'); out.mkdir(exist_ok=True)
          rows=list(csv.reader(src.open(encoding='utf-8-sig',newline=''))); header,body=rows[0],rows[1:]
          wanted={'10.1201/9781003077770-78','10.18174/371265','10.56093/ehyqc013','10.1111/jfb.12710','10.1007/s10750-026-06204-0','10.1002/fsh.10985','10.2458/v24i1.20963','10.6084/m9.figshare.31147177.v1','10.14288/1.0058967','10.1021/pr049840t','10.1038/s41598-019-39080-x','10.3354/dao01972','10.1007/s11160-022-09714-x','10.15586/ijfs.v38i2.3600'}
          def norm(s):
              s=(s or '').strip().lower(); s=re.sub(r'^https?://doi.org/','',s); s=re.sub(r'^doi:\s*','',s); return s.rstrip(' .;,')
          doi_idx=next(i for i,h in enumerate(header) if 'doi' in h.lower())
          selected=[r for r in body if len(r)>=7 and norm(r[doi_idx]) in wanted]
          if len(selected)!=14: raise SystemExit(f'Expected 14 DOI records, found {len(selected)}')
          with (out/'selected_records.csv').open('w',encoding='utf-8',newline='') as f: csv.writer(f).writerows([header,*selected])
          with (out/'dois.txt').open('w',encoding='utf-8') as f:
              for r in selected: f.write(norm(r[doi_idx])+'\n')
          # Find the no-DOI member of the original 15-record test by the known title; do not substitute another record.
          target=next((r for r in body if len(r)>=7 and not norm(r[doi_idx]) and r[6].strip()),None)
          if target is None: raise SystemExit('Could not identify the no-DOI test record')
          with (out/'no_doi_record.csv').open('w',encoding='utf-8',newline='') as f: csv.writer(f).writerows([header,target])
          print('Prepared 14 DOI records plus one no-DOI record. Column G is authoritative.')
          PY

      - name: Run PyPaperBot DOI retrieval
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p pypaperbot_test/downloads_doi
          set -o pipefail
          python -m PyPaperBot --doi-file=pypaperbot_test/dois.txt --dwn-dir=pypaperbot_test/downloads_doi --restrict 1 --use-doi-as-filename 2>&1 | tee pypaperbot_test/doi.log

      - name: Run PyPaperBot title retrieval
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p pypaperbot_test/downloads_title
          python - <<'PY' 2>&1 | tee pypaperbot_test/title.log
          import csv, subprocess
          from pathlib import Path
          rows=list(csv.reader(Path('pypaperbot_test/no_doi_record.csv').open(encoding='utf-8-sig',newline='')))
          title=rows[1][6]
          print('TITLE='+title)
          subprocess.run(['python','-m','PyPaperBot','--query',title,'--dwn-dir','pypaperbot_test/downloads_title','--scholar-pages','1','--restrict','1'],check=False)
          PY

      - name: Build per-record audit
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,re
          from pathlib import Path
          out=Path('pypaperbot_test')
          rows=list(csv.reader((out/'selected_records.csv').open(encoding='utf-8-sig',newline=''))); header,body=rows[0],rows[1:]
          doi_idx=next(i for i,h in enumerate(header) if 'doi' in h.lower())
          files=[p for p in (out/'downloads_doi').rglob('*') if p.is_file()]
          audits=[]
          for r in body:
              doi=re.sub(r'^https?://doi.org/','',r[doi_idx].strip(),flags=re.I); token=doi.lower().replace('/','_')
              matches=[p for p in files if token in p.name.lower()]
              audits.append({'title_column_G':r[6],'doi':doi,'downloaded':bool(matches),'files':';'.join(str(p.relative_to(out)) for p in matches),'sha256':hashlib.sha256(matches[0].read_bytes()).hexdigest() if matches else '','identity_status':'downloaded_requires_identity_check' if matches else 'not_retrieved'})
          # Add the no-DOI title-query record as its own row.
          nr=list(csv.reader((out/'no_doi_record.csv').open(encoding='utf-8-sig',newline='')))[1]
          tfiles=[p for p in (out/'downloads_title').rglob('*') if p.is_file()]
          audits.append({'title_column_G':nr[6],'doi':'','downloaded':bool(tfiles),'files':';'.join(str(p.relative_to(out)) for p in tfiles),'sha256':hashlib.sha256(tfiles[0].read_bytes()).hexdigest() if tfiles else '','identity_status':'title_download_requires_identity_check' if tfiles else 'not_retrieved'})
          with (out/'pypaperbot_audit.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=audits[0].keys()); w.writeheader(); w.writerows(audits)
          print(f'Created audit for {len(audits)} records; DOI files={len(files)}, title files={len(tfiles)}')
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pypaperbot-15-record-test-${{ github.run_id }}
          path: pypaperbot_test/
          if-no-files-found: error
