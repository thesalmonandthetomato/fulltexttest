name: Validate extraction data

on:
  push:
    paths:
      - 'data/**'
      - 'R/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'R/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install R dependencies
        run: Rscript -e 'install.packages("readr", repos="https://cloud.r-project.org")'
      - name: Validate canonical CSV in R
        run: Rscript R/validate_master.R
      - name: Write audit manifest
        shell: bash
        run: |
          mkdir -p outputs
          printf 'commit_sha,run_id,ref\n%s,%s,%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_REF}" > outputs/validation_run.csv
      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: validation-manifest
          path: outputs/validation_run.csv
