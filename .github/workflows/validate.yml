name: Validate reference data

on:
  push:
    paths:
      - 'data/**'
      - 'R/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'R/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Install validation dependencies
        run: Rscript -e 'install.packages(c("readr","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Check reference file
        run: |
          Rscript -e 'x <- read.csv("data/living_evidence_map_master.csv", nrows=5, check.names=FALSE); stopifnot(nrow(x) >= 1); cat("Reference file readable; columns:", ncol(x), "\n")'
      - name: Write audit manifest
        shell: bash
        run: |
          mkdir -p outputs
          printf 'commit_sha,run_id,ref,reference_file\n%s,%s,%s,%s\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_REF}" "data/living_evidence_map_master.csv" > outputs/validation_run.csv
      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: validation-manifest
          path: outputs/validation_run.csv
