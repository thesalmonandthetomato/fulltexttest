name: OpenAlex daily free full-text retrieval
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
jobs:
  retrieve:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests lxml pypdf beautifulsoup4
      - name: Retrieve up to 100 new OpenAlex content files
        shell: python
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          import csv, gzip, hashlib, json, os, re, time
          from pathlib import Path
          import requests
          from lxml import etree
          from pypdf import PdfReader
          
          DAILY_LIMIT = 100
          root = Path('corpus')
          root.mkdir(exist_ok=True)
          manifest = Path('doi_manifest.csv')
          if not manifest.exists():
              raise SystemExit('Missing doi_manifest.csv; add the 13,389 DOI manifest before enabling the daily run.')
          
          def norm(doi):
              return re.sub(r'^(?:https?://doi.org/|doi:)','',doi.strip(),flags=re.I).rstrip(' .;,').lower()
          def slug(doi):
              return hashlib.sha256(doi.encode()).hexdigest()[:20]
          
          rows = list(csv.DictReader(manifest.open(newline='', encoding='utf-8')))
          session = requests.Session()
          session.headers['User-Agent'] = 'fulltexttest/doi-fulltext-retrieval/3.0'
          key = os.environ.get('OPENALEX_API_KEY')
          if not key:
              raise SystemExit('OPENALEX_API_KEY secret is required')
          
          used = 0
          successes = 0
          failures = 0
          results = []
          
          def get(url, **kwargs):
              for attempt in range(8):
                  try:
                      r = session.get(url, timeout=90, allow_redirects=True, **kwargs)
                  except Exception as e:
                      if attempt == 7: raise
                      time.sleep(min(60, 2 ** attempt)); continue
                  if r.status_code not in (429,500,502,503,504) or attempt == 7:
                      return r
                  ra = r.headers.get('Retry-After')
                  try: delay = min(120, float(ra)) if ra else min(120, 2 ** attempt)
                  except ValueError: delay = min(120, 2 ** attempt)
                  time.sleep(delay)
          
          def parse_pdf(data):
              p = Path('/tmp/fulltext.pdf'); p.write_bytes(data)
              try:
                  reader = PdfReader(str(p))
                  text = '\n\n'.join(page.extract_text() or '' for page in reader.pages)
                  return text, len(reader.pages)
              finally:
                  p.unlink(missing_ok=True)
          
          def parse_xml(data):
              root = etree.fromstring(data)
              body = '\n'.join(' '.join(''.join(n.itertext()).split()) for n in root.xpath('//*[local-name()="body"]')).strip()
              return body
          
          for row in rows:
              if used >= DAILY_LIMIT: break
              doi = norm(row.get('doi',''))
              if not doi: continue
              d = root / slug(doi)
              meta_path = d / 'metadata.json'
              if meta_path.exists():
                  try:
                      if json.loads(meta_path.read_text()).get('verified_complete'): continue
                  except Exception: pass
              # Obtain current OpenAlex metadata.
              r = get('https://api.openalex.org/works/https://doi.org/' + requests.utils.quote(doi), params={'api_key': key})
              if not r.ok:
                  results.append({'doi':doi,'status':'metadata_http_'+str(r.status_code)})
                  continue
              w = r.json()
              has = w.get('has_content') or {}
              if not (has.get('grobid_xml') or has.get('pdf')):
                  results.append({'doi':doi,'status':'no_openalex_content'})
                  continue
              wid = (w.get('id') or '').rstrip('/').split('/')[-1]
              if not wid: continue
              d.mkdir(parents=True, exist_ok=True)
              audit = {'doi':doi,'openalex_id':w.get('id'),'title':w.get('display_name'),'retrieved_at':None,'verified_complete':False,'source':None,'openalex':{'has_content':has,'is_oa':(w.get('open_access') or {}).get('is_oa'),'locations':w.get('locations',[]),'best_oa_location':w.get('best_oa_location')},'attempts':[]}
              # One OpenAlex content file per DOI: prefer TEI, otherwise PDF.
              if has.get('grobid_xml'):
                  url = f'https://content.openalex.org/works/{wid}.grobid-xml'
                  r = get(url, params={'api_key':key})
                  audit['attempts'].append({'kind':'grobid_xml','http':r.status_code,'url':r.url})
                  if r.ok:
                      try:
                          data = gzip.decompress(r.content) if r.content[:2] == b'\x1f\x8b' else r.content
                          body = parse_xml(data)
                          if len(body) >= 3000:
                              (d/'fulltext.xml.gz').write_bytes(gzip.compress(data, compresslevel=6))
                              audit.update(verified_complete=True,source='OpenAlex TEI',retrieved_at=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),text_chars=len(body),format='tei-xml',sha256=hashlib.sha256(data).hexdigest())
                              used += 1; successes += 1
                      except Exception as e:
                          audit['attempts'][-1]['parse_error']=repr(e)
              if not audit['verified_complete'] and has.get('pdf') and used < DAILY_LIMIT:
                  url = f'https://content.openalex.org/works/{wid}.pdf'
                  r = get(url, params={'api_key':key})
                  audit['attempts'].append({'kind':'pdf','http':r.status_code,'url':r.url})
                  if r.ok and r.content.startswith(b'%PDF'):
                      try:
                          text,pages = parse_pdf(r.content)
                          if len(text) >= 3000:
                              (d/'fulltext.pdf.gz').write_bytes(gzip.compress(r.content, compresslevel=6))
                              audit.update(verified_complete=True,source='OpenAlex PDF',retrieved_at=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),text_chars=len(text),pages=pages,format='pdf',sha256=hashlib.sha256(r.content).hexdigest())
                              used += 1; successes += 1
                      except Exception as e:
                          audit['attempts'][-1]['parse_error']=repr(e)
              if audit['verified_complete']:
                  (d/'metadata.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False))
                  results.append({'doi':doi,'status':'retrieved','source':audit['source']})
              else:
                  failures += 1
                  (d/'metadata.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False))
                  results.append({'doi':doi,'status':'content_failed'})
              # Small pacing gap to avoid burst traffic.
              time.sleep(0.25)
          
          out = Path('daily-results.json')
          out.write_text(json.dumps({'date':time.strftime('%Y-%m-%d',time.gmtime()),'attempted_content_files':used,'successes':successes,'failures':failures,'results':results},indent=2))
          print(json.dumps({'attempted_content_files':used,'successes':successes,'failures':failures},indent=2))
      - name: Commit durable corpus checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corpus daily-results.json
          git diff --cached --quiet || git commit -m "Checkpoint daily full-text retrieval"
          git push
      - name: Upload daily audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: daily-fulltext-audit-${{ github.run_id }}
          path: daily-results.json
          retention-days: 7
