name: OpenAlex daily free full-text retrieval
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
concurrency:
  group: openalex-daily-free-content
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests lxml pypdf
      - name: Check long-term storage is configured
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          echo '=== STORAGE CHECK ==='
          test -n "$ZENODO_TOKEN" || { echo 'ERROR: ZENODO_TOKEN is required. Refusing to download without durable storage.'; exit 1; }
          echo 'Zenodo token: present'
      - name: Retrieve and archive daily full texts
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python scripts/openalex_daily_retrieve.py
      - name: Commit retrieval checkpoint
        run: |
          echo 'CHECKPOINT: committing retrieval state to GitHub'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/openalex_free_state.json
          git diff --cached --quiet || git commit -m "Checkpoint daily full-text retrieval"
          git push
          echo 'CHECKPOINT: GitHub state committed'
      - name: Upload audit only
        uses: actions/upload-artifact@v4
        with:
          name: openalex-free-audit-${{ github.run_id }}
          path: daily-results.json
          retention-days: 7
