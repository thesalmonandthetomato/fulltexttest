name: Oxylabs Scholar first-link full-text retrieval

on:
  workflow_dispatch:

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests beautifulsoup4 pypdf

      - name: Search Scholar through Oxylabs and retrieve only first access link
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          DOI = '10.1021/pr049840t'
          OUT = Path('oxylabs_fulltext_test')
          OUT.mkdir()

          s = requests.Session()
          s.headers.update({'User-Agent': 'Mozilla/5.0'})

          payload = {'source': 'google_scholar', 'query': DOI, 'parse': False}
          r = s.post(
              'https://realtime.oxylabs.io/v1/queries',
              auth=(os.environ['OXYLABS_USERNAME'], os.environ['OXYLABS_PASSWORD']),
              json=payload,
              timeout=120,
          )
          r.raise_for_status()
          response = r.json()

          # Oxylabs returns the raw Google Scholar page in the result's content field.
          # Keep the whole API response for auditability, then parse the returned content.
          (OUT / 'oxylabs_response.json').write_text(
              json.dumps(response, indent=2, ensure_ascii=False), encoding='utf-8'
          )

          results = response.get('results') or []
          if not results:
              raise RuntimeError('Oxylabs returned no result objects')
          result0 = results[0]
          html = result0.get('content') or result0.get('raw_content') or ''
          if not html:
              raise RuntimeError(
                  f"Oxylabs result object contains no content field; keys={sorted(result0.keys())}"
              )
          (OUT / 'scholar_raw.html').write_text(html, encoding='utf-8')

          soup = BeautifulSoup(html, 'html.parser')
          first = soup.select_one('div.gs_r')
          if not first:
              raise RuntimeError('No first Google Scholar result found')
          ggs = first.select_one('div.gs_ggs')
          if not ggs:
              raise RuntimeError('First Scholar result has no right-hand access block')

          # Only the first PDF/HTML access link is eligible. Do not try a second link.
          access = None
          for a in ggs.select('a'):
              href = a.get('href')
              if not href:
                  continue
              label_el = a.select_one('.gs_ctg2')
              label = (label_el.get_text(' ', strip=True) if label_el else a.get_text(' ', strip=True)).strip()
              upper = label.upper()
              if upper.startswith('[PDF]') or upper.startswith('[HTML]'):
                  access = {
                      'label': label,
                      'url': urljoin('https://scholar.google.com/', href),
                  }
                  break
          if not access:
              raise RuntimeError('No first [PDF]/[HTML] access link found')

          (OUT / 'access.json').write_text(json.dumps(access, indent=2), encoding='utf-8')
          print('First access link:', access)

          # One retrieval attempt only: the first access link, with redirects followed.
          fr = s.get(access['url'], timeout=120, allow_redirects=True)
          meta = {
              'doi': DOI,
              'scholar_access_label': access['label'],
              'scholar_access_url': access['url'],
              'final_url': fr.url,
              'http_status': fr.status_code,
              'content_type': fr.headers.get('content-type', ''),
              'bytes': len(fr.content),
          }
          fr.raise_for_status()

          ct = fr.headers.get('content-type', '').lower()
          if 'pdf' in ct or fr.content[:5] == b'%PDF-':
              path = OUT / 'fulltext.pdf'
              path.write_bytes(fr.content)
              try:
                  reader = PdfReader(str(path))
                  text = '\n'.join((p.extract_text() or '') for p in reader.pages)
                  meta.update({
                      'representation': 'PDF',
                      'pages': len(reader.pages),
                      'text_chars': len(text),
                      'parseable': bool(text.strip()),
                  })
                  (OUT / 'fulltext.txt').write_text(text, encoding='utf-8')
              except Exception as e:
                  meta.update({'representation': 'PDF', 'parseable': False, 'parse_error': repr(e)})
          elif 'html' in ct or '<html' in fr.text[:500].lower():
              path = OUT / 'fulltext.html'
              path.write_bytes(fr.content)
              text = BeautifulSoup(fr.content, 'html.parser').get_text('\n', strip=True)
              meta.update({
                  'representation': 'HTML',
                  'text_chars': len(text),
                  'parseable': bool(text.strip()),
              })
              (OUT / 'fulltext.txt').write_text(text, encoding='utf-8')
          else:
              path = OUT / 'retrieved.bin'
              path.write_bytes(fr.content)
              meta.update({'representation': 'OTHER', 'parseable': False})

          (OUT / 'retrieval.json').write_text(
              json.dumps(meta, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          print(json.dumps(meta, indent=2))

      - name: Upload retrieval audit and full text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxylabs-scholar-first-link-retrieval-${{ github.run_id }}
          path: oxylabs_fulltext_test/
          if-no-files-found: warn
