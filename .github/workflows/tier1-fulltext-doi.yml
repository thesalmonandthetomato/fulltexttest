name: Tier 1 DOI full-text retrieval

on:
  workflow_dispatch:

concurrency:
  group: tier1-fulltext-doi
  cancel-in-progress: false

env:
  CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
  SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests lxml

      - name: Verify dependencies
        run: python -c "import requests,lxml; print('dependencies OK')"

      - name: Retrieve Tier 1 full text by DOI
        shell: python
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
        run: |
          import csv, json, os, re, time
          from pathlib import Path
          import requests
          from lxml import etree

          OUT = Path('tier1_results')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers['User-Agent'] = 'fulltexttest/tier1-doi/1.1'

          records = [
            ("10.1021/pr049840t", "Application of isotope coded affinity tag (ICAT) analysis for the identification of differentially expressed proteins following infection of atlantic salmon (Salmo salar) with infectious hematopoietic necrosis virus (IHNV) or Renibacterium salmoninarum (BKD)"),
            ("10.1002/fsh.10985", "Inadvertent Hatchery Rainbow Trout Oncorhynchus mykiss Discovered in Native Westslope Cutthroat Trout Oncorhynchus clarkii lewisi Habitat: A Cautionary Tale"),
            ("10.1201/9781003077770-78", "Fish Farming Technology - Biological basis for landbased farming of Atlantic salmon: Growth"),
            ("10.2458/v24i1.20963", "Petri dishes of an archipelago: the ecological rubble of the Chilean salmon farming industry"),
            ("10.1007/s11160-022-09714-x", "A review of marine stressors impacting Atlantic salmon Salmo salar, with an assessment of the major threats to English stocks"),
            ("10.3354/dao01972", "Real-time PCR detection of Moritella viscosa, the likely causal agent of winter-ulcer in Atlantic salmon Salmo salar and rainbow trout Oncorhynchus mykiss"),
            ("10.18174/371265", "Next-generation salmonid alphavirus vaccine development"),
            ("10.14288/1.0058967", "Physico-chemical aspects of sediment recovery at two abandoned salmon farm sites in British Columbia"),
            ("10.1038/s41598-019-39080-x", "Wound healing in post-smolt Atlantic salmon (Salmo salar L.)"),
            ("10.1111/jfb.12710", "Chronic stress of rainbow trout Oncorhynchus mykiss at high altitude: a field study"),
            ("10.15586/ijfs.v38i2.3600", "Environmental effects on nutrient composition of Turkish Salmon (Oncorhynchus mykiss): a comparison between marine and reservoir systems"),
            ("10.6084/m9.figshare.31147177.v1", "Salmon"),
            ("10.56093/ehyqc013", "Pathology of Aeromonas hydrophila infection in rainbow trout (Oncorhynchus mykiss) of Himachal Pradesh"),
            ("10.1007/s10750-026-06204-0", "Ecological patterns of benthic communities in relation to salmon aquaculture in the Inner Sea of Chiloé (southern Chile)"),
            ("", "Sinop Yöresinde Denizde Kafeslerde Farklı Yemlerle Yapılan Gökkuşağı Alabalığı (Oncorhynchus mykiss W. 1792) Yetiştiriciliği Üzerine Bir Araştırma")
          ]

          def norm_doi(s):
              s=(s or '').strip().lower()
              s=re.sub(r'^https?://doi.org/','',s)
              s=re.sub(r'^doi:\s*','',s)
              return s.rstrip(' .;,')

          def norm_title(s):
              return re.sub(r'[^a-z0-9]+',' ',(s or '').lower()).strip()

          def title_score(a,b):
              aa=set(norm_title(a).split()); bb=set(norm_title(b).split())
              return len(aa & bb)/max(1,len(aa | bb))

          def safe(s): return re.sub(r'[^A-Za-z0-9._-]+','_',s)[:100]

          def get(url, **kwargs):
              for attempt in range(5):
                  r=session.get(url, timeout=90, **kwargs)
                  if r.status_code not in (429,500,502,503,504): return r
                  time.sleep(min(30, 2**attempt))
              return r

          def save_raw(path, content, binary=False):
              if binary: path.write_bytes(content)
              else: path.write_text(content, encoding='utf-8')

          def inspect_tei(xml_bytes, target_title, target_doi):
              result={
                  'xml_parseable':False,
                  'tei_root':False,
                  'title':'',
                  'doi_fields':[],
                  'authors':0,
                  'abstract_chars':0,
                  'body_sections':0,
                  'body_paragraphs':0,
                  'body_chars':0,
                  'reference_count':0,
                  'title_score':0.0,
                  'doi_match':False,
                  'structural_fulltext':False,
                  'structural_reason':''
              }
              try:
                  root=etree.fromstring(xml_bytes)
                  result['xml_parseable']=True
                  result['tei_root']=etree.QName(root).localname.lower() == 'tei'
                  titles=root.xpath('//*[local-name()="titleStmt"]//*[local-name()="title"] | //*[local-name()="article-title"]')
                  if titles:
                      result['title']=' '.join(''.join(titles[0].itertext()).split())
                  doi_nodes=root.xpath('//*[local-name()="idno" and translate(@type,"DOI","doi")="doi"] | //*[local-name()="pub-id" and translate(@pub-id-type,"DOI","doi")="doi"]')
                  for n in doi_nodes:
                      d=' '.join(''.join(n.itertext()).split())
                      if d: result['doi_fields'].append(norm_doi(d))
                  result['doi_match']=bool(target_doi and norm_doi(target_doi) in result['doi_fields'])
                  result['authors']=len(root.xpath('//*[local-name()="author"]'))
                  result['abstract_chars']=len(' '.join(''.join(x.itertext()).split() for x in root.xpath('//*[local-name()="abstract"]')))
                  result['body_sections']=len(root.xpath('//*[local-name()="body"]//*[local-name()="div" or local-name()="div1" or local-name()="div2" or local-name()="div3" or local-name()="section" or local-name()="head"]'))
                  result['body_paragraphs']=len(root.xpath('//*[local-name()="body"]//*[local-name()="p"]'))
                  result['body_chars']=len(' '.join(''.join(x.itertext()).split() for x in root.xpath('//*[local-name()="body"]')))
                  result['reference_count']=len(root.xpath('//*[local-name()="listBibl"]//*[local-name()="biblStruct"] | //*[local-name()="ref"]'))
                  result['title_score']=title_score(target_title,result['title'])
                  reasons=[]
                  if not result['xml_parseable']: reasons.append('xml_not_parseable')
                  if result['title_score'] < 0.90: reasons.append('title_mismatch')
                  if target_doi and not result['doi_match']: reasons.append('doi_field_mismatch')
                  if result['body_chars'] < 5000: reasons.append('body_too_short')
                  if result['body_paragraphs'] < 10: reasons.append('too_few_body_paragraphs')
                  result['structural_fulltext']=len(reasons)==0
                  result['structural_reason']='ok' if result['structural_fulltext'] else ';'.join(reasons)
              except Exception as e:
                  result['structural_reason']=f'parse_error:{e}'
              return result

          audit=[]
          for n,(doi,title) in enumerate(records,1):
              stem=f'{n:02d}_{safe(doi or "no-doi")}'
              row={'n':n,'doi':doi,'database_title':title}

              # Europe PMC
              try:
                  if doi:
                      q=requests.utils.quote(f'DOI:"{doi}"')
                      r=get(f'https://www.ebi.ac.uk/europepmc/webservices/rest/search?query={q}&resultType=core&format=json')
                      row['europepmc_http']=r.status_code
                      save_raw(OUT/f'{stem}_europepmc_search.json',r.text)
                      hits=(r.json().get('resultList',{}).get('result',[]) if r.ok else [])
                      exact=[h for h in hits if norm_doi(h.get('doi'))==norm_doi(doi)]
                      row['europepmc_exact']=len(exact)
                      if exact:
                          h=exact[0]; row['europepmc_id']=h.get('id',''); row['europepmc_pmcid']=h.get('pmcid',''); row['europepmc_title']=h.get('title','')
                          pmcid=h.get('pmcid')
                          if pmcid:
                              xr=get(f'https://www.ebi.ac.uk/europepmc/webservices/rest/{pmcid}/fullTextXML')
                              row['europepmc_fulltext_http']=xr.status_code
                              if xr.ok and xr.content:
                                  save_raw(OUT/f'{stem}_europepmc_fulltext.xml',xr.content,binary=True)
                                  row['europepmc_fulltext']='xml'
              except Exception as e: row['europepmc_error']=repr(e)

              # CORE
              try:
                  key=os.environ.get('CORE_API_KEY','')
                  if key and doi:
                      r=get('https://api.core.ac.uk/v3/search/works',params={'q':f'doi:"{doi}"','limit':10},headers={'Authorization':f'Bearer {key}'})
                      row['core_search_http']=r.status_code
                      save_raw(OUT/f'{stem}_core_search.json',r.text)
                      data=r.json() if r.ok else {}
                      hits=data.get('results',[]) or data.get('data',[])
                      exact=[h for h in hits if norm_doi(h.get('doi') or h.get('metadata',{}).get('doi'))==norm_doi(doi)]
                      row['core_exact']=len(exact)
                      for j,h in enumerate(exact[:3],1):
                          cid=h.get('id') or h.get('coreId')
                          if not cid: continue
                          ar=get(f'https://api.core.ac.uk/v3/articles/get/{cid}',headers={'Authorization':f'Bearer {key}'})
                          row[f'core_article_{j}_http']=ar.status_code
                          save_raw(OUT/f'{stem}_core_{cid}.json',ar.text)
                          if ar.ok:
                              ad=ar.json(); row[f'core_article_{j}_title']=ad.get('title') or ad.get('metadata',{}).get('title','')
                              payload=next((ad[k] for k in ('fullText','full_text','text') if isinstance(ad.get(k),str) and ad[k].strip()),None)
                              if payload:
                                  save_raw(OUT/f'{stem}_core_{cid}.txt',payload); row[f'core_article_{j}_fulltext']='text'
                              pdf_url=ad.get('downloadUrl') or ad.get('fullTextUrl') or ad.get('metadata',{}).get('downloadUrl')
                              if pdf_url:
                                  pr=get(pdf_url,headers={'Authorization':f'Bearer {key}'})
                                  row[f'core_article_{j}_download_http']=pr.status_code
                                  if pr.ok and pr.content.startswith(b'%PDF'):
                                      save_raw(OUT/f'{stem}_core_{cid}.pdf',pr.content,binary=True); row[f'core_article_{j}_pdf']='pdf'
              except Exception as e: row['core_error']=repr(e)

              # OpenAlex
              try:
                  if doi:
                      q=requests.utils.quote(doi)
                      r=get(f'https://api.openalex.org/works/https://doi.org/{q}')
                      row['openalex_http']=r.status_code
                      save_raw(OUT/f'{stem}_openalex.json',r.text)
                      if r.ok:
                          w=r.json(); row['openalex_id']=w.get('id',''); row['openalex_title']=w.get('display_name',''); row['openalex_doi']=w.get('doi','')
                          row['openalex_has_pdf']=bool(w.get('has_content',{}).get('pdf')); row['openalex_has_tei']=bool(w.get('has_content',{}).get('grobid_xml'))
                          key=os.environ.get('OPENALEX_API_KEY',''); wid=(w.get('id','').rstrip('/').split('/')[-1])
                          if key and wid:
                              if row['openalex_has_tei']:
                                  tr=get(f'https://content.openalex.org/works/{wid}.grobid-xml',params={'api_key':key})
                                  row['openalex_tei_http']=tr.status_code
                                  if tr.ok and tr.content:
                                      save_raw(OUT/f'{stem}_openalex.tei.xml',tr.content,binary=True); row['openalex_fulltext']='tei'
                                      tei=inspect_tei(tr.content,title,doi)
                                      for k,v in tei.items(): row[f'openalex_tei_{k}']=v
                              if row['openalex_has_pdf']:
                                  pr=get(f'https://content.openalex.org/works/{wid}.pdf',params={'api_key':key})
                                  row['openalex_pdf_http']=pr.status_code
                                  if pr.ok and pr.content.startswith(b'%PDF'):
                                      save_raw(OUT/f'{stem}_openalex.pdf',pr.content,binary=True); row['openalex_fulltext_pdf']='pdf'
                          elif not key: row['openalex_note']='OPENALEX_API_KEY not configured; metadata only'
              except Exception as e: row['openalex_error']=repr(e)

              # Springer Nature OA
              try:
                  key=os.environ.get('SPRINGER_API_KEY','')
                  if key and doi:
                      q=requests.utils.quote(f'doi:{doi}')
                      jr=get(f'https://api.springernature.com/openaccess/jats',params={'q':q,'api_key':key})
                      row['springer_http']=jr.status_code
                      save_raw(OUT/f'{stem}_springer_jats.xml',jr.text)
                      if jr.ok and jr.content:
                          try:
                              root=etree.fromstring(jr.content); text=' '.join(x.strip() for x in root.itertext() if x and x.strip())
                              row['springer_text_chars']=len(text); row['springer_has_body']=bool(root.xpath('//*[local-name()="body"]'))
                          except Exception: pass
              except Exception as e: row['springer_error']=repr(e)

              audit.append(row)
              print(f'[{n}/15] {doi or "NO DOI"} complete')
              time.sleep(2)

          fields=sorted({k for r in audit for k in r.keys()})
          with (OUT/'audit.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(audit)
          (OUT/'audit.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Completed 15-record Tier 1 retrieval with TEI structural checks.')

      - name: Upload Tier 1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-fulltext-results-${{ github.run_id }}
          path: tier1_results/
          if-no-files-found: warn
