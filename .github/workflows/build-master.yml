name: Build canonical master CSV

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/pilot_index_100.csv'
      - 'R/build_master_csv.R'
      - '.github/workflows/build-master.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install R dependencies
        run: Rscript -e 'install.packages("readr", repos="https://cloud.r-project.org")'
      - name: Build canonical CSV
        run: Rscript R/build_master_csv.R
      - name: Commit canonical CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master_100_extractions.csv
          git diff --cached --quiet || git commit -m 'Rebuild canonical 100-record CSV'
          git push
