name: R CI

on:
  push:
    paths:
      - 'R/**'
      - 'scripts/**'
      - 'data/living_evidence_map_master.csv'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'R/**'
      - 'scripts/**'
      - 'data/living_evidence_map_master.csv'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev pkg-config

      - name: Verify system dependencies
        run: |
          set -euo pipefail
          command -v pkg-config
          pkg-config --exists libcurl

      - name: Install packages
        run: |
          set -euo pipefail
          Rscript -e "install.packages(c('readr','httr2','jsonlite'), repos='https://cloud.r-project.org')"
          Rscript -e "stopifnot(requireNamespace('readr', quietly=TRUE), requireNamespace('httr2', quietly=TRUE), requireNamespace('jsonlite', quietly=TRUE))"

      - name: Parse-check R files
        run: |
          set -euo pipefail
          Rscript -e "files <- c('R/check_dataset.R','R/retrieval.R','scripts/run_retrieval.R'); for (f in files) { parse(f); cat('OK:', f, '\\n') }"

      - name: Validate master dataset
        run: |
          set -euo pipefail
          Rscript -e "source('R/check_dataset.R'); x <- check_dataset('data/living_evidence_map_master.csv'); cat('Records:', nrow(x), '\\n'); cat('Columns:', ncol(x), '\\n')"
