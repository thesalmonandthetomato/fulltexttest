name: Read archived batch 39 manifest only
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_batch39_zip.R'
      - '.github/workflows/audit-batch39-archive.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - run: Rscript -e 'install.packages(c("httr2","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Inspect one existing ZIP and its DOI manifest
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: Rscript scripts/audit_batch39_zip.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-batch39-doi-audit-${{ github.run_id }}
          path: outputs/historical39/
          if-no-files-found: warn
          retention-days: 30
