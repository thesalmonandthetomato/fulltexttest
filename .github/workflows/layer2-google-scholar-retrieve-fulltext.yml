name: Layer 2 Google Scholar full-text retrieval

on:
  workflow_dispatch:

concurrency:
  group: layer2-google-scholar-retrieve-fulltext
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input requests beautifulsoup4 pypdf

      - name: Search Scholar and retrieve first PDF/HTML link only
        shell: python
        run: |
          import csv, json, re, time
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path('layer2_google_scholar_fulltext'); OUT.mkdir(exist_ok=True)
          DOCS=OUT/'documents'; DOCS.mkdir(exist_ok=True)
          TEXT=OUT/'text'; TEXT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-GB,en;q=0.9'})
          records=[('01','10.1021/pr049840t'),('03','10.1201/9781003077770-78'),('08','10.14288/1.0058967'),('10','10.1111/jfb.12710'),('11','10.15586/ijfs.v38i2.3600'),('12','10.6084/m9.figshare.31147177.v1'),('13','10.56093/ehyqc013'),('14','10.1007/s10750-026-06204-0')]
          audit=[]
          for n,doi in records:
              row={'record':n,'doi':doi,'search_url':f'https://scholar.google.com/scholar?q={quote_plus(chr(34)+doi+chr(34))}','scholar_http':None,'first_result_found':False,'first_access_link':None,'retrieval':None}
              try:
                  r=s.get(row['search_url'],timeout=60); row['scholar_http']=r.status_code
                  (OUT/f'{n}_scholar_search.html').write_text(r.text,encoding='utf-8')
                  soup=BeautifulSoup(r.text,'html.parser'); result=soup.select_one('div.gs_r')
                  if result:
                      ri=result.select_one('div.gs_ri'); row['first_result_found']=bool(ri)
                      if ri:
                          title=ri.select_one('h3.gs_rt'); row['first_result_title']=title.get_text(' ',strip=True) if title else ''; row['first_result_url']=title.select_one('a')['href'] if title and title.select_one('a') else ''
                      ggs=result.select_one('div.gs_ggs')
                      if ggs:
                          # Only the FIRST [PDF] or [HTML] access link is considered. Never try another.
                          for a in ggs.select('a'):
                              label_el=a.select_one('.gs_ctg2'); label=label_el.get_text(' ',strip=True) if label_el else a.get_text(' ',strip=True)
                              if a.get('href') and label in ('[PDF]','[HTML]'):
                                  row['first_access_link']={'label':label,'url':urljoin('https://scholar.google.com/',a['href'])}; break
                      if row['first_access_link']:
                          link=row['first_access_link']; att={'label':link['label'],'scholar_url':link['url']}
                          try:
                              rr=s.get(link['url'],timeout=90,allow_redirects=True); att.update({'http':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type',''),'bytes':len(rr.content)})
                              ct=att['content_type'].lower(); content=rr.content
                              if rr.ok and (link['label']=='[PDF]' or 'application/pdf' in ct or content[:4]==b'%PDF'):
                                  path=DOCS/f'{n}_scholar.pdf'; path.write_bytes(content); reader=PdfReader(str(path)); text='\n\n'.join(p.extract_text() or '' for p in reader.pages); txt=TEXT/f'{n}_scholar.txt'; txt.write_text(text,encoding='utf-8'); att.update({'format':'PDF','saved_file':str(path),'pages':len(reader.pages),'text_chars':len(text),'text_file':str(txt),'retrieved_fulltext':bool(text.strip())})
                              elif rr.ok and (link['label']=='[HTML]' or 'text/html' in ct):
                                  html=content.decode(rr.encoding or 'utf-8',errors='replace'); path=DOCS/f'{n}_scholar.html'; path.write_text(html,encoding='utf-8'); hs=BeautifulSoup(html,'html.parser'); [x.decompose() for x in hs(['script','style','noscript'])]; text=hs.get_text('\n',strip=True); txt=TEXT/f'{n}_scholar.txt'; txt.write_text(text,encoding='utf-8'); att.update({'format':'HTML','saved_file':str(path),'text_chars':len(text),'text_file':str(txt),'retrieved_fulltext':bool(text.strip())})
                              else: att['retrieved_fulltext']=False
                          except Exception as e: att.update({'error':repr(e),'retrieved_fulltext':False})
                          row['retrieval']=att
              except Exception as e: row['error']=repr(e)
              (OUT/f'{n}_audit.json').write_text(json.dumps(row,indent=2,ensure_ascii=False),encoding='utf-8'); audit.append(row); print(f"[{n}] {doi}: Scholar={row['scholar_http']} first={row['first_result_found']} first_access={row['first_access_link']} retrieved={bool(row.get('retrieval',{}).get('retrieved_fulltext'))}"); time.sleep(3)
          fields=['record','doi','scholar_http','first_result_found','first_result_title','first_result_url','first_access_link_json','retrieval_json','error']
          with (OUT/'audit.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for x in audit: w.writerow({'record':x.get('record'),'doi':x.get('doi'),'scholar_http':x.get('scholar_http'),'first_result_found':x.get('first_result_found'),'first_result_title':x.get('first_result_title',''),'first_result_url':x.get('first_result_url',''),'first_access_link_json':json.dumps(x.get('first_access_link'),ensure_ascii=False),'retrieval_json':json.dumps(x.get('retrieval'),ensure_ascii=False),'error':x.get('error','')})
          (OUT/'audit.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Completed Layer 2. Only the first [PDF]/[HTML] access link on the first Scholar result was attempted. No identity/completeness verification was performed.')

      - name: Upload retrieved full texts and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer2-google-scholar-fulltext-${{ github.run_id }}
          path: layer2_google_scholar_fulltext/
          if-no-files-found: warn
