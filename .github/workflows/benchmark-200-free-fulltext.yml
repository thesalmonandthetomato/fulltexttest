name: Benchmark 200 DOI free full-text retrieval

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/200-doi-free-fulltext
    paths:
      - .github/workflows/benchmark-200-free-fulltext.yml
      - scripts/benchmark_200_free_fulltext.R

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c("readr", "httr2", "jsonlite", "dplyr", "purrr", "stringr", "tidyr"))

      - name: Run 200-DOI benchmark
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
        run: Rscript scripts/benchmark_200_free_fulltext.R

      - name: Show coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/benchmark_200_free/coverage.csv ]; then
            cat results/benchmark_200_free/coverage.csv | sed 's/,/ | /g' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### By source and file type" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/benchmark_200_free/summary_by_source_filetype.csv ]; then
            cat results/benchmark_200_free/summary_by_source_filetype.csv | sed 's/,/ | /g' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-200-free-fulltext-${{ github.run_id }}
          path: results/benchmark_200_free/
          if-no-files-found: warn
          retention-days: 30
